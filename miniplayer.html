<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  /* The mini player, modeled on Apple Music's own player bar: one pill (round ends) with a hairline
     outline; the controls left, the song in the middle with a thin progress line under its words, our
     own buttons and volume right. Pointing at the middle crossfades the song to a scrubber (bigger,
     brighter times over a longer, thicker bar; drag or click to seek, ← / → when it has the focus).
     Colours: the theme tokens only (theme.css / theme.js). Glass: on KDE (X11) the desktop behind the
     pill is blurred by KWin (blur-behind) under a translucent tint; elsewhere the pill is the Glass
     material made from the artwork; Glass off, a plain tint. Nothing animates at idle. */
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: transparent; }
  body {
    font-family: -apple-system, 'SF Pro Text', 'Segoe UI', Ubuntu, Cantarell, sans-serif;
    height: 100vh;
    padding: 4px;
    -webkit-app-region: drag;
    overflow: hidden;
  }
  #pill {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px 0 14px;
    background: var(--s-over-page);
    border: 1px solid var(--s-edge);
    border-radius: 999px;
    overflow: hidden;
    color: var(--s-text);
  }
  /* KWin blurs what's behind the window: a lighter tint, contrast still checked (theme.js --s-blur-tint) */
  #pill.blur { background: var(--s-blur-tint); }
  button {
    -webkit-app-region: no-drag;
    position: relative;
    background: none;
    border: none;
    border-radius: 8px;
    color: var(--s-text);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  button:hover { background: var(--s-hover); }
  button:focus { outline: none; }
  button:focus-visible, #seek:focus-visible, #volume:focus-visible { outline: 2px solid var(--s-ring); outline-offset: -2px; }
  button svg { width: 20px; height: 20px; fill: currentColor; }
  #playpause svg { width: 23px; height: 23px; }
  button.small { color: var(--s-soft); }
  button.small svg { width: 17px; height: 17px; }
  button.small:hover { color: var(--s-text); }
  button.active, button.small.active { color: var(--s-ring); }
  #controls, #right { display: flex; align-items: center; gap: 0; flex-shrink: 0; }

  /* the middle: the artwork, then the song's words with their thin progress line, which turn into the
     scrubber while the pointer rests on them (~120 ms hover intent, so passing over on the way to the
     buttons doesn't flicker) or the keyboard is on the bar; then the star and the ⋯, which always stay
     where they are, clickable. Nothing playing: no scrubber at all. */
  #center {
    -webkit-app-region: no-drag;
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #mid { position: relative; flex: 1; min-width: 0; height: 100%; }
  #np, #scrub { position: absolute; inset: 0; transition: opacity 0.15s ease; }
  #np { display: flex; flex-direction: column; justify-content: center; }
  #scrub { display: flex; flex-direction: column; justify-content: center; gap: 2px; opacity: 0; pointer-events: none; }
  #mid.hot #np, #mid:focus-within #np, #mid.scrubbing #np { opacity: 0; }
  #mid.hot #scrub, #mid:focus-within #scrub, #mid.scrubbing #scrub { opacity: 1; pointer-events: auto; }
  #center.idle #scrub { display: none; }
  #center.idle #np { opacity: 1; }
  /* nothing playing, nothing to favourite: the star steps aside (its place stays) */
  #center.idle #fav { visibility: hidden; }
  #art {
    width: 40px;
    height: 40px;
    border-radius: 5px;
    background: var(--s-hover);
    object-fit: cover;
    flex-shrink: 0;
    cursor: pointer;
  }
  .title-row { display: flex; align-items: center; gap: 5px; min-width: 0; }
  #title { font-size: 13px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #subtitle { font-size: 12px; line-height: 1.3; color: var(--s-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rating-badge {
    flex-shrink: 0;
    font-size: 8px;
    font-weight: 700;
    line-height: 1;
    padding: 2px 3px;
    border-radius: 3px;
    color: var(--s-soft);
    background: var(--s-hover);
  }
  #fav { color: var(--s-soft); }
  #fav:hover { color: var(--s-text); }
  #fav svg { width: 15px; height: 15px; }
  #more svg { width: 17px; height: 17px; }
  /* the thin progress line under the words, as wide as the text block (Apple's) */
  #line { height: 2px; margin-top: 5px; border-radius: 1px; background: var(--s-track); overflow: hidden; }
  #line i, #seek-fill { display: block; height: 100%; width: 100%; background: var(--s-text); transform-origin: left center; transform: scaleX(0); }
  /* the scrubber: bigger, brighter times over a longer, thicker bar */
  #times { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--s-text); padding: 0 1px; }
  #seek { position: relative; height: 24px; cursor: pointer; border-radius: 4px; }
  #seek-track { position: absolute; left: 0; right: 0; top: 9px; height: 6px; border-radius: 3px; background: var(--s-track); overflow: hidden; }
  #seek-knob {
    position: absolute;
    top: 5px;
    left: 0;
    width: 14px;
    height: 14px;
    margin-left: -7px;
    border-radius: 50%;
    background: var(--s-text);
    box-shadow: 0 1px 3px var(--s-shadow);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  #seek:hover #seek-knob, #seek:focus-visible #seek-knob, #mid.scrubbing #seek-knob { opacity: 1; }
  #volume {
    -webkit-app-region: no-drag;
    -webkit-appearance: none;
    width: 64px;
    height: 32px;
    margin: 0 0 0 2px;
    background: transparent;
    outline: none;
    cursor: pointer;
    flex-shrink: 0;
  }
  #volume::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--s-track); }
  #volume::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: var(--s-text); }
  @media (prefers-reduced-motion: reduce) {
    #np, #scrub, #seek-knob { transition: none; }
  }
</style>
</head>
<body>
  <div id="pill">
    <div id="controls">
      <button id="shuffle" class="small" title="Shuffle" aria-label="Shuffle" aria-pressed="false">
        <svg viewBox="0 0 16 16"><path d="M11.5 2.5h3v3l-1.15-1.15-2.8 2.8-1.06-1.06 2.8-2.8L11.5 2.5zM1 3h2.9c.5 0 .97.2 1.32.55l1.53 1.53-1.06 1.06-1.53-1.53a.37.37 0 0 0-.26-.11H1V3zm13.5 7.5v3h-3l1.15-1.15-2.44-2.44a.37.37 0 0 0-.26-.11H8v-1.5h1.95c.5 0 .97.2 1.32.55l2.44 2.44 1.29-1.29zM1 11.5h2.9c.1 0 .19-.04.26-.11l6.19-6.19 1.5 1.06-6.63 6.63c-.35.35-.83.55-1.32.55H1v-1.5z"/></svg>
      </button>
      <button id="prev" title="Previous" aria-label="Previous">
        <svg viewBox="0 0 16 16"><path d="M8.7 7.35 14.6 3.6a.75.75 0 0 1 1.15.63v7.54a.75.75 0 0 1-1.15.63L8.7 8.65v3.12a.75.75 0 0 1-1.15.63L1.3 8.63a.75.75 0 0 1 0-1.26L7.55 3.6a.75.75 0 0 1 1.15.63v3.12z"/></svg>
      </button>
      <button id="playpause" title="Play / Pause" aria-label="Play">
        <svg id="icon-play" viewBox="0 0 16 16"><path d="M4 2.3a.75.75 0 0 1 1.15-.63l9 5.7a.75.75 0 0 1 0 1.26l-9 5.7A.75.75 0 0 1 4 13.7V2.3z"/></svg>
        <svg id="icon-pause" viewBox="0 0 16 16" style="display:none"><path d="M4 2h2.5v12H4zM9.5 2H12v12H9.5z"/></svg>
      </button>
      <button id="next" title="Next" aria-label="Next">
        <svg viewBox="0 0 16 16"><path d="M7.3 7.35 1.4 3.6a.75.75 0 0 0-1.15.63v7.54a.75.75 0 0 0 1.15.63l5.9-3.75v3.12a.75.75 0 0 0 1.15.63l6.25-3.77a.75.75 0 0 0 0-1.26L8.45 3.6a.75.75 0 0 0-1.15.63v3.12z"/></svg>
      </button>
      <button id="repeat" class="small" title="Repeat" aria-label="Repeat" aria-pressed="false">
        <svg viewBox="0 0 16 16"><path d="M3.5 5.5h7V7l3-2.25L10.5 2.5V4h-7A2.5 2.5 0 0 0 1 6.5V8h1.5V6.5c0-.55.45-1 1-1zm9 5h-7V9l-3 2.25 3 2.25V12h7A2.5 2.5 0 0 0 15 9.5V8h-1.5v1.5c0 .55-.45 1-1 1z"/></svg>
        <span id="repeat-one" style="display:none;position:absolute;font-size:8px;font-weight:700;margin-top:-1px">1</span>
      </button>
    </div>

    <div id="center" class="idle">
      <img id="art" title="Open full player" alt="" role="button" tabindex="0" aria-label="Open full player">
      <div id="mid">
        <div id="np">
          <div class="title-row">
            <span id="title">Not playing</span>
            <span id="rating-badge" style="display:none">E</span>
          </div>
          <div id="subtitle"></div>
          <div id="line"><i id="line-fill"></i></div>
        </div>
        <div id="scrub">
          <div id="times"><span id="time-elapsed">0:00</span><span id="time-remaining">-0:00</span></div>
        <div id="seek" role="slider" tabindex="0" aria-label="Song position" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
          <div id="seek-track"><i id="seek-fill"></i></div>
          <span id="seek-knob"></span>
          </div>
        </div>
      </div>
      <button id="fav" class="small" title="Favorite" aria-label="Favorite" aria-pressed="false">
                <svg id="icon-fav-off" viewBox="0 0 16 16"><path d="M8 1.6l1.86 3.95 4.14.5-3.06 2.86.83 4.19L8 11.6l-3.77 1.5.83-4.19L2 6.05l4.14-.5z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
            <svg id="icon-fav-on" viewBox="0 0 16 16" style="display:none"><path d="M8 1.6l1.86 3.95 4.14.5-3.06 2.86.83 4.19L8 11.6l-3.77 1.5.83-4.19L2 6.05l4.14-.5z"/></svg>
              </button>
      <button id="more" class="small" title="More" aria-label="More">
            <svg viewBox="0 0 16 16"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg>
          </button>
    </div>

    <div id="right">
      <button id="lyrics" class="small" title="Lyrics" aria-label="Lyrics" aria-pressed="false">
        <svg viewBox="0 0 16 16"><path d="M8 1.5c-3.87 0-7 2.57-7 5.75 0 1.84 1.05 3.47 2.68 4.52-.13.72-.53 1.5-1.32 2.14-.18.15-.06.44.17.42 1.55-.15 2.77-.82 3.55-1.48.61.13 1.25.2 1.92.2 3.87 0 7-2.57 7-5.8S11.87 1.5 8 1.5zM4.5 8.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm3.5 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm3.5 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>
      </button>
      <button id="queue" class="small" title="Playlist / Up Next" aria-label="Up Next">
        <svg viewBox="0 0 16 16"><path d="M1 3h9v1.5H1V3zm0 4h9v1.5H1V7zm0 4h6v1.5H1V11zm11.5-8H14v7.55a2.5 2.5 0 1 1-1.5-.51V3z"/></svg>
      </button>
      <button id="mute" class="small" title="Mute / Unmute" aria-label="Mute">
        <svg id="icon-vol" viewBox="0 0 16 16"><path d="M8.5 2.06a.75.75 0 0 1 .43.68v10.52a.75.75 0 0 1-1.21.59L4.6 11.5H2.25a.75.75 0 0 1-.75-.75v-5.5A.75.75 0 0 1 2.25 4.5H4.6l3.12-2.35a.75.75 0 0 1 .78-.09zM11.3 5.53a.75.75 0 0 1 1.06 0 3.5 3.5 0 0 1 0 4.95.75.75 0 1 1-1.06-1.07 2 2 0 0 0 0-2.82.75.75 0 0 1 0-1.06zm1.94-1.94a.75.75 0 0 1 1.06 0 6.25 6.25 0 0 1 0 8.83.75.75 0 1 1-1.06-1.06 4.75 4.75 0 0 0 0-6.71.75.75 0 0 1 0-1.06z"/></svg>
        <svg id="icon-muted" viewBox="0 0 16 16" style="display:none"><path d="M8.5 2.06a.75.75 0 0 1 .43.68v10.52a.75.75 0 0 1-1.21.59L4.6 11.5H2.25a.75.75 0 0 1-.75-.75v-5.5A.75.75 0 0 1 2.25 4.5H4.6l3.12-2.35a.75.75 0 0 1 .78-.09zM11.03 6.22a.75.75 0 0 1 1.06 0L13 7.13l.91-.91a.75.75 0 1 1 1.06 1.06l-.91.91.91.91a.75.75 0 1 1-1.06 1.06L13 9.25l-.91.91a.75.75 0 1 1-1.06-1.06l.91-.91-.91-.91a.75.75 0 0 1 0-1.06z"/></svg>
      </button>
      <input id="volume" type="range" min="0" max="100" value="100" title="Volume (scroll to change)" aria-label="Volume">
    </div>
  </div>
<script>
  const { ipcRenderer } = require('electron')
  // loop: none in this page — it only reacts to main-process pushes ('palette', 'favorite-state', 'now-playing' at 1/s)
  // lifetime: the three ipcRenderer.on listeners ('theme', 'favorite-state', 'now-playing') are added once at load and die with the window

  // the one theme system (theme.js): the pill's colours follow the album. Glass: KWin's blur of the
  // desktop behind the pill when main could ask for it (blurBehind), else the artwork Glass material
  const pill = document.getElementById('pill')
  const theme = require('./theme-apply').attach({ surfaces: [pill] })
  ipcRenderer.on('theme', (event, t) => {
    const blur = !!(t && t.glass && t.blurBehind)
    pill.classList.toggle('blur', blur)
    theme.set(blur ? Object.assign({}, t, { backdrop: null }) : t)
  })

  const send = (cmd, value) => ipcRenderer.send('mini-command', cmd, value)
  document.getElementById('shuffle').onclick = () => send('toggleShuffle')
  document.getElementById('prev').onclick = () => send('previous')
  document.getElementById('playpause').onclick = () => send('playPause')
  document.getElementById('next').onclick = () => send('next')
  document.getElementById('repeat').onclick = () => send('cycleRepeat')
  document.getElementById('queue').onclick = () => send('queue')
  document.getElementById('lyrics').onclick = () => send('lyrics')
  document.getElementById('more').onclick = () => send('moreMenu')
  document.getElementById('art').onclick = () => send('expand')
  // lifetime: one keydown listener on the artwork (a button for the keyboard: Enter / Space)
  document.getElementById('art').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); send('expand') } })
  document.getElementById('fav').onclick = () => send('toggleFavorite')

  function setFavorite(rating) {
    const on = rating === 1
    document.getElementById('fav').classList.toggle('active', on)
    document.getElementById('icon-fav-off').style.display = on ? 'none' : ''
    document.getElementById('icon-fav-on').style.display = on ? '' : 'none'
    document.getElementById('fav').title = on ? 'Undo Favorite' : 'Favorite'
    document.getElementById('fav').setAttribute('aria-pressed', String(on))
  }
  ipcRenderer.on('favorite-state', (event, fav) => {
    if (fav && fav.ok) setFavorite(fav.rating)
  })

  // --- the progress line and the scrubber (mini-model.js has the maths) ---
  const mm = require('./mini-model')
  let currentDuration = 0
  let currentTime = 0
  let seekHoldUntil = 0      // after a seek, the 1 s push waits a moment so the bar doesn't jump back
  const center = document.getElementById('center')
  const mid = document.getElementById('mid')
  const seek = document.getElementById('seek')
  // hover intent: the scrubber opens once the pointer has rested ~120 ms on the song's words, so
  // passing over them on the way to the star or the ⋯ doesn't flicker; it closes when the pointer leaves
  let hotTimer = null
  // lifetime: pointerenter / pointerleave on the words, one each for the window's life
  mid.addEventListener('pointerenter', () => {
    clearTimeout(hotTimer)
    // loop: hover intent · one 120 ms one-shot per pointer entry · cleared on leave · cost ~0
    hotTimer = setTimeout(() => mid.classList.add('hot'), 120)
  })
  mid.addEventListener('pointerleave', () => { clearTimeout(hotTimer); hotTimer = null; mid.classList.remove('hot') })
  const fills = [document.getElementById('line-fill'), document.getElementById('seek-fill')]
  const knob = document.getElementById('seek-knob')
  function showTime(t, d) {
    const f = d > 0 ? Math.min(1, Math.max(0, t / d)) : 0
    for (const el of fills) el.style.transform = 'scaleX(' + f.toFixed(4) + ')'   // loop: NOT-WORTH — 2 bars
    knob.style.left = (f * 100).toFixed(2) + '%'
    document.getElementById('time-elapsed').textContent = mm.clock(t)
    document.getElementById('time-remaining').textContent = d ? '-' + mm.clock(d - t) : '-0:00'
    seek.setAttribute('aria-valuemax', String(Math.round(d)))
    seek.setAttribute('aria-valuenow', String(Math.round(t)))
    seek.setAttribute('aria-valuetext', mm.clock(t) + ' of ' + mm.clock(d))
  }
  function seekTo(t) {
    currentTime = t
    seekHoldUntil = performance.now() + 1500
    showTime(t, currentDuration)
    send('seek', t)
  }
  // drag or click the bar to seek: the bar follows the pointer, the song seeks on release
  let dragging = false
  const at = (e) => { const r = seek.getBoundingClientRect(); return mm.seekAt(e.clientX, r.left, r.width, currentDuration) }
  // lifetime: pointerdown/move/up and keydown on the bar, one each for the window's life
  seek.addEventListener('pointerdown', (e) => {
    if (!currentDuration || e.button !== 0) return
    dragging = true
    seek.setPointerCapture(e.pointerId)
    mid.classList.add('scrubbing')
    showTime(at(e), currentDuration)
  })
  seek.addEventListener('pointermove', (e) => { if (dragging) showTime(at(e), currentDuration) })
  seek.addEventListener('pointerup', (e) => {
    if (!dragging) return
    dragging = false
    mid.classList.remove('scrubbing')
    seekTo(at(e))
  })
  seek.addEventListener('keydown', (e) => {
    const t = mm.keySeek(e.key, currentTime, currentDuration)
    if (t === null) return
    e.preventDefault()
    seekTo(t)
  })

  const volumeSlider = document.getElementById('volume')
  let draggingVolume = false
  let lastVolume = 1
  volumeSlider.onpointerdown = () => { draggingVolume = true }
  volumeSlider.onpointerup = () => { draggingVolume = false }
  volumeSlider.oninput = () => {
    send('setVolume', volumeSlider.value / 100)
    updateMuteIcon(volumeSlider.value / 100)
    showVolume(volumeSlider.value / 100)
  }
  // the volume said in words (tooltip and screen readers), whatever changed it
  function showVolume(v) {
    const pct = wheel.percent(v)
    volumeSlider.title = 'Volume ' + pct + ' % (scroll to change)'
    volumeSlider.setAttribute('aria-valuetext', pct + ' %')
    document.getElementById('mute').title = 'Mute / Unmute · volume ' + pct + ' % (scroll to change)'
  }
  // Mouse wheel over the slider or the speaker: 5 % per notch, up = louder (wheel-volume.js adds a
  // trackpad's small deltas up to whole notches). The window doesn't scroll. The 1 s now-playing
  // push waits a moment so it can't jump the slider back while the wheel turns.
  const wheel = require('./wheel-volume')
  const wheelSteps = wheel.createWheelSteps()
  let wheelHoldUntil = 0
  function onWheel(e) {
    e.preventDefault()
    const steps = wheelSteps.feed(e.deltaY, e.deltaMode, e.timeStamp)
    if (!steps) return
    const next = wheel.stepVolume(volumeSlider.value / 100, steps)
    if (next > 0) lastVolume = next
    volumeSlider.value = Math.round(next * 100)
    wheelHoldUntil = performance.now() + 1500
    send('setVolume', next)
    updateMuteIcon(next)
    showVolume(next)
  }
  // lifetime: one wheel listener each on the slider and the speaker button, for the window's life (not passive: it stops the scroll)
  volumeSlider.addEventListener('wheel', onWheel, { passive: false })
  document.getElementById('mute').addEventListener('wheel', onWheel, { passive: false })
  document.getElementById('mute').onclick = () => {
    const current = volumeSlider.value / 100
    const next = current > 0 ? 0 : (lastVolume > 0 ? lastVolume : 1)
    if (current > 0) lastVolume = current
    volumeSlider.value = next * 100
    send('setVolume', next)
    updateMuteIcon(next)
  }
  function updateMuteIcon(volume) {
    document.getElementById('icon-vol').style.display = volume > 0 ? '' : 'none'
    document.getElementById('icon-muted').style.display = volume > 0 ? 'none' : ''
  }

  ipcRenderer.on('now-playing', (event, state) => {
    if (!state || !state.ok) return
    document.getElementById('title').textContent = state.title || 'Not playing'
    document.getElementById('subtitle').textContent =
      state.artist ? state.artist + (state.album ? ' — ' + state.album : '') : ''
    const art = document.getElementById('art')
    // lifetime: the <img> src is only replaced on a track change, so one artwork image is held at a time
    if (state.artwork && art.src !== state.artwork) art.src = state.artwork
    document.getElementById('icon-play').style.display = state.isPlaying ? 'none' : ''
    document.getElementById('icon-pause').style.display = state.isPlaying ? '' : 'none'
    document.getElementById('playpause').setAttribute('aria-label', state.isPlaying ? 'Pause' : 'Play')
    document.getElementById('shuffle').classList.toggle('active', !!state.shuffle)
    document.getElementById('shuffle').setAttribute('aria-pressed', String(!!state.shuffle))
    document.getElementById('repeat').classList.toggle('active', state.repeat > 0)
    document.getElementById('repeat').setAttribute('aria-pressed', String(state.repeat > 0))
    // the lyrics window open: its button is lit (Apple lights its own panel buttons)
    document.getElementById('lyrics').classList.toggle('active', !!state.lyricsOpen)
    document.getElementById('lyrics').setAttribute('aria-pressed', String(!!state.lyricsOpen))
    document.getElementById('repeat-one').style.display = state.repeat === 1 ? '' : 'none'
    document.getElementById('rating-badge').style.display =
      state.contentRating === 'explicit' ? '' : 'none'
    currentDuration = state.duration || 0
    // nothing playing: the words only ("Not playing"), no scrubber; the star and the ⋯ stay usable
    center.classList.toggle('idle', !state.title || !currentDuration)
    if (!dragging && performance.now() > seekHoldUntil) {
      currentTime = state.playbackTime || 0
      showTime(currentTime, currentDuration)
    }
    if (!draggingVolume && performance.now() > wheelHoldUntil && typeof state.volume === 'number') {
      volumeSlider.value = Math.round(state.volume * 100)
      updateMuteIcon(state.volume)
      showVolume(state.volume)
    }
  })
</script>
