<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="lyrics-view.css">
<style>
  /* colours: the theme tokens (theme.css / theme.js); the card is the shared Glass material */
  :root {
    --fg-dim: var(--s-dim);    /* lines not being sung: faded, but >= 3:1 on the card (theme.js) */
    --active: var(--s-text);   /* the sung line; the album accent as text (>= 4.5:1) while Adaptive album color is on */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: transparent; height: 100%; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Ubuntu, Cantarell, sans-serif;
    padding: 4px;
    -webkit-app-region: drag;
  }
  #card {
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--s-over-page);
    border: 1px solid var(--s-edge);
    border-radius: 16px;
    color: var(--s-text);
    overflow: hidden;
  }
  /* album art as a little vinyl record: grooved black disc, the cover as its centre label and a
     spindle hole, inside a progress ring; click shows the album in the main window */
  #art {
    -webkit-app-region: no-drag;
    flex-shrink: 0;
    position: relative;
    width: 62px;
    height: 62px;
    display: none;
    cursor: pointer;
    perspective: 200px;
  }
  #art.shown { display: block; }
  #art:focus { outline: none; }
  #art:focus-visible #spin { outline: 2px solid var(--s-ring); outline-offset: 2px; }
  #ring { position: absolute; inset: 0; width: 62px; height: 62px; transform: rotate(-90deg); }
  #ring circle { fill: none; stroke-width: 1.2; }
  #ring .track { stroke: var(--s-edge); }
  #ring .fill { stroke: var(--active); stroke-linecap: round; }
  #spin {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    overflow: hidden;
    /* grooves: fine concentric rings; a faint sheen so the turn reads like real vinyl */
    background:
      conic-gradient(from 20deg, transparent 0 8%, var(--s-vinyl-sheen) 12%, transparent 18% 58%,
                     var(--s-vinyl-sheen-2) 62%, transparent 68%),
      repeating-radial-gradient(circle, var(--s-vinyl-a) 0 0.7px, var(--s-vinyl-b) 0.7px 1.4px);
    box-shadow: 0 1px 4px var(--s-art-shadow), inset 0 0 0 1px var(--s-vinyl-rim);
  }
  body.spin #spin { animation: spin var(--turn, 1.8s) linear infinite; }
  body.spin.still #spin { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* the label: the album cover, kept large (78 %) so the art stays readable; the grooves
     show as a vinyl rim around it */
  #thumb {
    position: absolute;
    inset: 11%;
    width: 78%;
    height: 78%;
    box-shadow: 0 0 0 1px var(--s-art-shadow);
    display: block;
    border-radius: 50%;
    object-fit: cover;
  }
  /* spindle hole */
  #spin::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 3px;
    height: 3px;
    margin: -1.5px 0 0 -1.5px;
    border-radius: 50%;
    background: var(--s-vinyl-hole);
    box-shadow: 0 0 0 0.5px var(--s-vinyl-sheen);
  }
  /* the tonearm, seen from above (only while the record spins, Settings → "Spin album art like a
     record"): drawn once (SVG), pivoting at the record's top right corner. Its angle follows the song
     as one linear Web Animation per play / seek / track (transform only, on the compositor), frozen
     on pause; it lifts off its shadow on pause, song end and while swinging back for a new song. */
  #tonearm { display: none; position: absolute; inset: 0; pointer-events: none; }
  body.spin #art.shown #tonearm { display: block; }
  #tonearm svg { position: absolute; left: 0; top: 0; width: 62px; height: 62px; overflow: visible; }
  #arm, #lift { position: absolute; inset: 0; transform-origin: 58px 4px; }
  #lift { transition: transform 0.3s ease; }
  #tonearm.lifted #lift { transform: translate(-0.7px, -1px) scale(1.04); }
  #header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 8px 16px;
  }
  /* title over artist, sized to sit next to the record */
  #song { flex: 1; min-width: 0; }
  #song .t, #song .a {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #song .t { font-size: 16px; font-weight: 700; color: var(--s-text); line-height: 1.25; }
  #song .a { font-size: 13px; font-weight: 600; color: var(--s-soft); line-height: 1.3; }
  #close {
    -webkit-app-region: no-drag;
    background: none;
    border: none;
    border-radius: 6px;
    color: var(--s-soft);
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #close:hover { background: var(--s-hover); color: var(--s-text); }
  /* the stage button: grows the lyrics window into the stage, or shrinks it back (stage-ui.js setForm) */
  #form {
    -webkit-app-region: no-drag;
    background: none;
    border: none;
    border-radius: 6px;
    color: var(--s-soft);
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  #form:hover { background: var(--s-hover); color: var(--s-text); }
  #form svg { width: 13px; height: 13px; fill: currentColor; }
  /* the keyboard's focus ring (the theme's ring colour, >= 3:1); a click shows none, so the look with
     a mouse is unchanged */
  #close:focus, #form:focus, #art:focus, #lines:focus, .line:focus { outline: none; }
  #close:focus-visible, #form:focus-visible, #lines:focus-visible { outline: 2px solid var(--s-ring); outline-offset: -2px; }
  #art:focus-visible { outline: 2px solid var(--s-ring); outline-offset: 1px; border-radius: 50%; }
  .line:focus-visible { outline: 2px solid var(--s-ring); outline-offset: 2px; border-radius: 8px; }
  /* for screen readers only: the lyrics' status ("No lyrics available…") */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #close svg { width: 12px; height: 12px; fill: currentColor; }
  #lines {
    -webkit-app-region: no-drag;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;   /* never sideways: a line wider than the list must not shift every line's start */
    padding: 8px 20px 40vh 20px;
    scroll-behavior: smooth;
  }
  #lines::-webkit-scrollbar { width: 0; }
  /* The header's drag area again, as the card's LAST child. Chromium 156 (Electron 45) sends a drag
     region for every element, in document order, the later one winning, and doesn't clip a scrolled
     element's region to its scroll box: the lines scrolled up out of #lines kept their no-drag rects
     over the header, so the window stopped dragging a few seconds into a song (0.15.39-dev.1). Rects
     after the lines win: #grip re-marks the header as drag, its two holes keep the cover and the close
     button clickable. Placed over the header by placeGrip(); invisible, no pointer events, not in the
     accessibility tree, so the header stays first for the keyboard and screen readers.
     The stage form has two scrolling lists (the lyrics and the queue), so #grip holds one drag patch
     (.ga) per area a scrolled list can cover: the header and the sheet-notes band over the lyrics, the
     queue's head over its list; each patch has a no-drag hole (i) per control in it. #grip itself has
     no region of its own. */
  #grip { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
  /* The Studio's left column is not a drag area: on Marcy's Wayland session at a 1.2 scale the no-drag holes
     cut for its controls didn't line up, and most of the Liner notes tile ignored the mouse (0.15.42-dev.1).
     The window moves by #grip's patches (the header, the band, the queue's title) as before. */
  body.stage { -webkit-app-region: no-drag; }
  #grip > .ga { position: absolute; -webkit-app-region: drag; }
  #grip > .ga > i { position: absolute; -webkit-app-region: no-drag; }
  @media (prefers-reduced-motion: reduce) { #lines { scroll-behavior: auto; } }
  .line {
    display: grid;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.3;
    padding: 7px 0;
    color: var(--fg-dim);
    cursor: pointer;
  }
  /* the line's colour changes as a crossfade on the compositor (a colour transition re-styled the
     window every frame): lyrics-view.js stacks three copies of a timed line in one grid cell, the
     unsung colour (.ly-dim), the hover colour (.ly-hov) and the karaoke layer (.ly-main, the sung
     colour). The one to show sits underneath at full opacity at once; the one leaving fades out on
     top, so the colour blends from old to new without dipping. */
  .line > .ly { grid-area: 1 / 1; }
  .line > .ly-dim { color: var(--fg-dim); }
  .line > .ly-hov { color: var(--s-text); }
  .line > .ly-main { color: var(--sing); }
  .line > .ly-dim, .line > .ly-hov, .line > .ly-main { opacity: 0; z-index: 1; transition: opacity 0.3s ease; }
  .line:not(.active):not(:hover) > .ly-dim,
  .line:hover:not(.active) > .ly-hov,
  .line.active > .ly-main { opacity: 1; z-index: 0; transition: none; }
  .line.plain { color: var(--s-text); cursor: default; }
  /* the sung line's words not reached yet (0.15.37): the theme's faded colour, >= 4.5:1 on the card in
     every theme, album colour and Glass (theme.js --s-upcoming), instead of lyrics-view.css's opacity
     0.4, which left them 1.7-3:1 (near-white on the light card). Sung words take the singer's colour.
     Only the karaoke layer's words (:where keeps the specificity, so .w.now's colour still wins); the
     colour switches with the word, the pop's transform eases (a colour transition would re-style the
     window every frame). */
  .line.active .w { opacity: 1; }
  .line.active > :where(.ly-main) .w { color: var(--s-upcoming); transition: transform 0.18s ease-out; }
  .line.active > :where(.ly-main) .w.sung { color: var(--sing); }
  /* backing vocals (after 0.15.40): secondary by size, weight and italics, and by colour, but never below the
     dim lines' 3:1 (lyrics-view.css's opacity 0.7 over the faded colour left "(ooh yeah)" at 2.1-2.4:1).
     Not sung yet, on any line: the dim lines' colour (theme.js --s-dim, fitted to >= 3:1 in every
     theme, album colour and Glass), so on the sung line they stay quieter than its own words still to
     come (--s-upcoming, 4.5:1). Being sung and sung: the singer's colour, as the main words. The ↳ takes
     the row's quiet colour. */
  .line .bgv { opacity: 1; }
  .line.active > :where(.ly-main) .bgv .w:not(.sung):not(.now), .line.active > .ly-main .bgv::before { color: var(--fg-dim); }
  /* the songwriter credit after the last line (lyrics-view.js writtenBy): quiet, like a booklet's credit */
  #credits {
    padding: 22px 0 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--s-soft);
    text-align: center;
  }
  #source {
    padding: 18px 0 6px;
    font-size: 11px;
    color: var(--s-soft);
    text-align: center;
  }
  #empty {
    position: relative;
    padding: 24px 20px;
    font-size: 13px;
    color: var(--s-soft);
    text-align: center;
  }
  /* lyrics timed for another version, shown untimed (lyrics-view.js versionNote): a quiet note over the lines */
  #lead {
    position: relative;
    padding: 6px 20px 10px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--s-soft);
    text-align: center;
  }
  /* an instrumental (lyrics-view.js statusText kind): a calm state of the song in the lyrics' own type, not a
     grey error line; its evidence sits behind the ⓘ */
  #empty.instrumental { padding: 40px 20px; color: var(--s-text); }
  #empty.instrumental .say { font-size: 30px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
  /* the ⓘ beside #empty's and #lead's text (info-tip.js; the .sn-info look below), its bubble under the text */
  #empty .sn-info, #lead .sn-info { vertical-align: middle; margin: -4px -4px -4px 2px; }
  #empty .sn-tip, #lead .sn-tip { text-align: left; }
  /* Expressive words' line while it can't draw yet (lyrics-view.js showXNote): a quiet note over the lines like #lead, its ⓘ and one button */
  #xnote { position: relative; padding: 6px 20px 10px; font-size: 11.5px; font-weight: 600; color: var(--s-soft); text-align: center; }
  #xnote .sn-info { vertical-align: middle; margin: -4px -4px -4px 2px; }
  #xnote .sn-tip { text-align: left; }
  #xnote .xact { min-height: 24px; margin: -4px 0 -4px 6px; padding: 0 9px; border: 1px solid var(--s-edge); border-radius: 6px; background: transparent; color: var(--s-text); font: inherit; font-weight: 600; cursor: pointer; vertical-align: middle; }
  #xnote .xact:hover { background: var(--s-hover); }
  #xnote .xact:focus { outline: none; }
  #xnote .xact:focus-visible { outline: 2px solid var(--s-ring); outline-offset: 1px; }
  [hidden] { display: none !important; }

  /* ===== the stage (body.stage): the lyrics window grown into the now-playing screen =====
     docs/mockups/stage-view.html (approved 2026-10-17). Three columns: the song and the transport, the
     lyrics (the reason for the window), what plays next. Theme tokens only; nothing animates on its own
     (stage-ui.js: transforms written on the time pushes, only when they change). */
  body.stage #card {
    display: grid;
    grid-template-columns: 292px minmax(0, 1fr) 312px;
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "np head queue" "np band queue" "np lines queue";
  }
  body.stage #np { grid-area: np; }
  body.stage #header { grid-area: head; padding: 14px 12px 6px 40px; min-width: 0; }
  body.stage #band { grid-area: band; }
  body.stage #lines { grid-area: lines; }
  body.stage #queue { grid-area: queue; }
  body.stage #art, body.stage #song { display: none; }
  #ctx { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; color: var(--s-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ctx b { color: var(--s-text); }
  /* the lyrics, big and left-set; the sung line held a third of the way down (lyrics-view.js anchor) */
  body.stage #lines {
    padding: 4px 56px 40vh 40px;
    -webkit-mask-image: linear-gradient(transparent 0, var(--s-text) 48px, var(--s-text) calc(100% - 64px), transparent 100%);
  }
  body.stage .line { font-size: 31px; padding: 9px 0; letter-spacing: -0.005em; }
  body.stage #credits { font-size: 13px; text-align: left; }
  body.stage #source { font-size: 12px; text-align: left; }
  body.stage #xnote { font-size: 12px; text-align: left; padding: 4px 0 10px; }
  body.stage #empty { font-size: 15px; text-align: left; padding: 24px 0; }
  body.stage #empty.instrumental { padding: 48px 0; }
  body.stage #empty.instrumental .say { font-size: 46px; }
  body.stage #lead { font-size: 12px; text-align: left; padding: 4px 0 10px; }
  #band { margin: 6px 18px 8px 22px; position: relative; }
  /* the sheet-notes band (sheet-notes-ui.js, Experimental): the staff and the pitch line, theme tokens
     only. Nothing here transitions or animates but the first play's "Listening and learning" dot (below): the strip moves by one Web Animation of its transform
     (compositor), the sung note changes class at its start and end. The label row on top, the staff (132 px)
     under it. The row never cuts its words off (the DS5 app's long-text rule, Marcy 2026-10-18): it wraps
     onto a second line when the column is narrow, and a longer explanation sits behind the ⓘ
     (sheet-notes-model.js mode(): visible text ≤ 60 characters, the rest in `info`). */
  .sn { position: relative; }
  .sn-top { position: relative; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-height: 26px; font-size: 11px; font-weight: 600; color: var(--s-soft); min-width: 0; }
  .sn-exp { padding: 1px 6px; border-radius: 4px; background: var(--s-notice); border: 1px solid var(--s-notice-bd); color: var(--s-text); font-size: 10px; letter-spacing: 0.02em; white-space: nowrap; }
  .sn-label { color: var(--s-text); }
  .sn-msg { color: var(--s-soft); font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  /* the ⓘ beside the message and its explanation (a bubble under the row, the row's width) */
  .sn-info { display: inline-grid; place-items: center; flex-shrink: 0; width: 24px; height: 24px; margin: -1px -4px -1px -6px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--s-soft); font: italic 700 11px/1 Georgia, serif; cursor: help; position: relative; -webkit-app-region: no-drag; }
  .sn-info::before { content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
  .sn-info:hover, .sn-info.open { color: var(--s-text); }
  .sn-info:focus { outline: none; }
  .sn-info:focus-visible { outline: 2px solid var(--s-ring); outline-offset: -2px; }
  .sn-info-text[hidden], .sn-tip[hidden] { display: none; }
  .sn-tip { position: absolute; left: 0; right: 0; top: calc(100% + 2px); z-index: 4; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--s-edge); background: var(--s-surface); box-shadow: 0 6px 16px var(--s-shadow); color: var(--s-text); font-size: 11.5px; font-weight: 500; line-height: 1.4; white-space: normal; pointer-events: none; }
  .sn-staff { position: relative; height: 132px; overflow: hidden; }
  /* the placement buttons (Band on top / Over the sung line), at the label row's end */
  .sn-place { display: flex; margin: -1px 0 -1px auto; padding: 1px; border-radius: 7px; border: 1px solid var(--s-edge); -webkit-app-region: no-drag; }
  .sn-place button { min-height: 24px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--s-soft); font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; }
  .sn-place button:hover { color: var(--s-text); background: var(--s-hover); }
  .sn-place button[aria-pressed="true"] { color: var(--s-text); font-weight: 700; box-shadow: inset 0 0 0 1px var(--s-ring); }
  .sn-place button:focus { outline: none; }
  .sn-place button:focus-visible { outline: 2px solid var(--s-ring); outline-offset: 1px; }
  /* "Over the sung line": the staff rides in the room the sung line opens above itself (lyrics-view.js
     opts.room; #sn-over moves with the list's scroll and, on a line change, by one transform animation).
     No syllable row: the sung words are right below. */
  body.stage #lines { position: relative; }
  #sn-over { position: absolute; left: 40px; right: 56px; top: 0; height: 136px; z-index: 2; -webkit-app-region: no-drag; }
  #sn-over .sn-staff { height: 110px; }
  /* in the room the block sits on the sung line: a label row that wraps grows upward, never over the line */
  #sn-over .sn { position: absolute; left: 0; right: 0; bottom: 0; }
  .sn.over .sn-syls { display: none; }
  .sn-fixed { position: absolute; left: 0; top: 0; width: 100%; }
  .sn-view { position: absolute; top: 0; right: 0; bottom: 0; overflow: hidden; }
  .sn-strip { position: absolute; left: 0; top: 0; height: 100%; will-change: transform; }
  .sn-svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .sn-syls { position: absolute; left: 0; top: 0; }
  .sn-syls .s { position: absolute; left: 0; top: 108px; font-size: 12px; font-weight: 600; line-height: 14px; color: var(--s-text); white-space: nowrap; }
  .sn-syls .s.past { color: var(--s-soft); }
  .sn-syls .s.now { color: var(--active); }
  .sn .sl, .sn .ledger, .sn .bar { stroke: var(--s-dim); stroke-width: 1; }
  .sn .gl { fill: var(--s-text); }
  .sn .clef8 { fill: var(--s-text); font-size: 9px; font-weight: 700; }
  .sn .n .head, .sn .n .held, .sn .n .gl { fill: var(--s-text); }
  .sn .n .held { fill-opacity: 0.45; }
  .sn .n.loose .head, .sn .n.loose .held, .sn .n.past .head, .sn .n.past .held, .sn .n.past .gl { fill: var(--s-dim); }
  .sn .n.now .head, .sn .n.now .held, .sn .n.now .gl { fill: var(--active); fill-opacity: 1; }
  .sn .ext { stroke: var(--s-soft); stroke-width: 1; }
  .sn .pl { fill: none; stroke: var(--s-soft); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .sn .pl.first { stroke: var(--active); }
  /* the pitch line beyond the staff box's room (sheet-notes-model.js roomRuns): along the edge, dashed, an arrow where it leaves */
  .sn .pl.out { stroke-dasharray: 3 4; }
  .sn .pl-mark { fill: var(--s-soft); }
  .sn .pl-mark.first { fill: var(--active); }
  .sn-head { position: absolute; left: 0; top: 26px; width: 2px; height: 84px; margin-left: -1px; border-radius: 1px; background: var(--active); }
  /* "Listening and learning" (first play, sheet-notes-model.js listening()): a small dot in the label row and
     one on the staff at the playhead, --s-live (theme.js: green, >= 3:1 on every surface), a soft 1.2 s
     opacity pulse (composited; the band's only CSS animation). Paused with the song or the window hidden
     (.still), steady with reduced motion, ringed in the text colour with more contrast. */
  .sn-live { display: inline-block; flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--s-live); animation: sn-live 1.2s ease-in-out infinite; }
  .sn-live[hidden] { display: none; }
  .sn-head .sn-live { position: absolute; left: -3px; top: 38px; }
  .sn.still .sn-live { animation-play-state: paused; }
  @keyframes sn-live { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .sn-live { animation: none; } }
  @media (prefers-contrast: more) { .sn-live { box-shadow: 0 0 0 1px var(--s-text); } }

  /* --- the Montage (montage-ui.js): related free photos drifting behind the lyrics, in the centre
     column only. Two photo layers move by transform and fade by opacity (composited); over them the
     shade: the theme's own surface colour at --scrim, raised per photo until every word passes
     (montage-model.js scrimFor), a little stronger where the words are. The mock-ups:
     docs/mockups/stage-view.html, ken-burns.html (w2-mockups). --- */
  #montage { display: none; }
  body.stage #montage { display: block; grid-column: 2; grid-row: 1 / span 3; position: relative; z-index: 0; overflow: hidden; pointer-events: none; }
  body.stage #header, body.stage #lines { position: relative; z-index: 1; }
  body.stage #band { z-index: 1; }
  .mt-photo { position: absolute; left: -7%; top: -7%; width: 114%; height: 114%; object-fit: cover; opacity: 0; will-change: transform, opacity; }
  #montage.calm .mt-photo { transition: opacity 3s ease; }
  .mt-scrim { position: absolute; inset: 0; z-index: 3; }
  .mt-scrim::before { content: ''; position: absolute; inset: 0; background: var(--s-surface); opacity: var(--scrim, 0.98); transition: opacity 0.3s ease; }
  .mt-scrim::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 40% 45%, var(--s-surface), transparent 75%); opacity: calc(var(--scrim, 0.98) * 0.55); transition: opacity 0.3s ease; }
  /* the credit line: the photo's author, licence and source; a click opens its Commons page */
  #mt-credit {
    -webkit-app-region: no-drag;
    grid-column: 2;
    grid-row: 3;
    align-self: end;
    justify-self: end;
    position: relative;
    z-index: 2;
    margin: 0 14px 12px;
    max-width: calc(100% - 28px);
    min-height: 24px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--s-edge);
    background: var(--s-over-page);
    color: var(--s-soft);
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  #mt-credit > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mt-credit b { color: var(--s-text); font-weight: 700; }
  #mt-credit svg { width: 12px; height: 12px; fill: currentColor; flex-shrink: 0; }
  #mt-credit:hover { color: var(--s-text); }
  #mt-credit:focus { outline: none; }
  #mt-credit:focus-visible { outline: 2px solid var(--s-ring); outline-offset: 2px; }
  body:not(.stage) #mt-credit { display: none; }

  /* --- left: now playing --- */
  #np {
    display: flex;
    flex-direction: column;
    padding: 22px 22px 16px;
    border-right: 1px solid var(--s-edge);
    min-width: 0;
    overflow: hidden;
  }
  /* the cover's size: smaller on a short window, so the song's actions and the layers still fit */
  #np { --cv: 248px; }
  @media (max-height: 720px) { #np { --cv: 200px; } }
  #cover {
    display: block;
    width: var(--cv);
    height: var(--cv);
    flex-shrink: 0;
    border-radius: 10px;
    object-fit: cover;
    align-self: center;
    box-shadow: 0 18px 40px var(--s-art-shadow), 0 0 0 1px var(--s-edge);
  }
  #np h1 {
    margin: 18px 0 2px;
    font-size: 21px;
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  #np-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* the song's links and the chips: at least 24 px tall to hit (WCAG 2.5.8), the words as before */
  #np-artist, #np-album { width: 100%; min-height: 24px; }
  #np-artist { font-size: 15px; font-weight: 600; color: var(--s-accent-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np-album { margin-top: 2px; font-size: 12.5px; color: var(--s-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #where { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--s-text);
    border: 1px solid var(--s-edge);
    max-width: 100%;
  }
  .chip > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.count i { display: block; flex-shrink: 0; width: 30px; height: 4px; border-radius: 2px; background: var(--s-track); position: relative; overflow: hidden; }
  .chip.count b { position: absolute; inset: 0; background: var(--s-ring); transform-origin: left center; transform: scaleX(0); }
  .chip.live { color: var(--s-soft); font-weight: 600; }
  .chip.live::before { content: '●'; font-size: 8px; color: var(--s-accent-text); }

  /* the sliders: a 4 px track in a 24 px tall hit area; the fill scales and the knob slides (transform) */
  .bar { position: relative; height: 24px; cursor: pointer; -webkit-app-region: no-drag; touch-action: none; }
  .bar::before { content: ''; position: absolute; left: 0; right: 0; top: 10px; height: 4px; border-radius: 2px; background: var(--s-track); }
  .bar > i { position: absolute; left: 0; right: 0; top: 10px; height: 4px; border-radius: 2px; background: var(--s-ring); transform-origin: left center; transform: scaleX(0); }
  .bar > span { position: absolute; left: 0; right: 0; top: 0; bottom: 0; transform: translateX(0); pointer-events: none; }
  .bar > span > b { position: absolute; left: -6px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--s-knob); box-shadow: 0 1px 3px var(--s-shadow); }
  .bar:focus { outline: none; }
  .bar:focus-visible { outline: 2px solid var(--s-ring); outline-offset: 2px; border-radius: 4px; }
  #seek { margin-top: 14px; }
  #seek .times { display: flex; justify-content: space-between; margin-top: 2px; font-size: 11px; font-weight: 600; color: var(--s-soft); font-variant-numeric: tabular-nums; }
  #transport { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 4px; }
  #transport .rep { position: relative; display: inline-grid; }
  #repeat-one { position: absolute; right: 6px; top: 3px; font-size: 9px; font-weight: 800; color: var(--s-accent-text); pointer-events: none; }
  #vol { display: flex; align-items: center; gap: 8px; color: var(--s-soft); }
  #vol svg { width: 15px; height: 15px; fill: currentColor; display: block; }
  #vol .bar { flex: 1; }
  #vol .bar > i { background: var(--s-soft); }
  /* the seek bar's hover: the time and the words sung there, above the bar (moves by transform) */
  #seek-tip { position: absolute; left: 0; bottom: 26px; transform: translateX(0); pointer-events: none; max-width: 240px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--s-edge); background: var(--s-surface); box-shadow: 0 6px 16px var(--s-shadow); font-size: 11px; font-weight: 600; color: var(--s-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 3; }
  #seek-tip b { font-variant-numeric: tabular-nums; margin-right: 6px; }
  #seek-tip span { color: var(--s-soft); }

  /* the song's actions, under the volume: one row of round buttons, and their note */
  #acts { display: flex; justify-content: space-between; margin-top: 10px; }
  .ib.act { width: 32px; height: 32px; color: var(--s-soft); }
  .ib.act:hover { color: var(--s-text); }
  .ib.act svg { width: 16px; height: 16px; }
  .ib.act[aria-pressed="true"] { color: var(--s-accent-text); }
  .ib.act[aria-disabled="true"] { cursor: default; }
  .ib.act[aria-disabled="true"]:hover { background: none; color: var(--s-soft); }
  /* the action's note: one line held for it under the actions; a longer note is never cut off (the DS5 app's
     long-text rule; it is a passing note, so no ⓘ): it wraps in a small card laid over what is below for
     the few seconds it shows (.long, set by stage-ui.js said()), so nothing in the full column moves */
  #act-slot { position: relative; z-index: 3; flex-shrink: 0; height: 17px; margin-top: 4px; }
  #act-note { position: absolute; left: 0; right: 0; top: 0; min-height: 17px; font-size: 11.5px; font-weight: 600; line-height: 1.35; color: var(--s-soft); text-align: center; overflow-wrap: anywhere; }
  #act-note.long { top: -3px; padding: 3px 8px; border-radius: 8px; border: 1px solid var(--s-edge); background: var(--s-surface); box-shadow: 0 6px 16px var(--s-shadow); color: var(--s-text); }
  /* a failure: the text colour (>= 4.5:1 on every album colour and Glass) in bold, the words say what failed */
  #act-note.error { color: var(--s-text); font-weight: 700; }

  /* the song's words are links (the album, the artist in Apple's page) */
  .lnk { -webkit-app-region: no-drag; display: block; max-width: 100%; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; border-radius: 4px; }
  .lnk:hover { text-decoration: underline; text-underline-offset: 2px; }
  .lnk:focus { outline: none; }
  .lnk:focus-visible { outline: 2px solid var(--s-ring); outline-offset: 2px; }
  button.chip { min-height: 24px; font: inherit; font-size: 11px; font-weight: 700; background: none; cursor: pointer; -webkit-app-region: no-drag; }
  button.chip.live { font-weight: 600; }
  button.chip:hover { background: var(--s-hover); }
  button.chip:focus { outline: none; }
  button.chip:focus-visible { outline: 2px solid var(--s-ring); outline-offset: 2px; }

  /* the cover turns over like a CD case (0.4 s, ease-out rotateY with perspective; transform only, only on a
     click); its back holds the song's credits at the cover's size. Reduce motion: a cross-fade instead. */
  #flip { width: var(--cv); height: var(--cv); flex-shrink: 0; align-self: center; position: relative; perspective: 900px; }
  #flip-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.3, 1); }
  #flip.turned #flip-in { transform: rotateY(180deg); }
  #flip .face { position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; -webkit-app-region: no-drag; }
  #cover-btn { padding: 0; border: 0; background: none; cursor: pointer; display: block; }
  #cover-btn:focus { outline: none; }
  #cover-btn:focus-visible { outline: 2px solid var(--s-ring); outline-offset: 3px; }
  #flip-hint { position: absolute; right: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--s-edge); background: var(--s-surface); color: var(--s-text); font-size: 11px; font-weight: 700; opacity: 0; transition: opacity 0.15s ease; }
  #flip-hint svg { width: 12px; height: 12px; fill: currentColor; }
  #cover-btn:hover #flip-hint, #cover-btn:focus-visible #flip-hint { opacity: 1; }
  #cover-back { transform: rotateY(180deg); overflow-y: auto; padding: 10px 14px 12px; border: 1px solid var(--s-edge); background: var(--s-surface); color: var(--s-text); box-shadow: 0 18px 40px var(--s-art-shadow); cursor: pointer; scrollbar-width: thin; scrollbar-color: var(--s-track) transparent; }
  .cb-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .cb-top .k { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--s-soft); }
  .cb-top .ib { width: 28px; height: 28px; }
  #cover-back dl, #q-pop dl { margin: 0; cursor: default; }
  #cover-back dt, #q-pop dt { font-size: 10.5px; font-weight: 700; color: var(--s-soft); margin-top: 7px; }
  #cover-back dd, #q-pop dd { margin: 1px 0 0; font-size: 12.5px; font-weight: 600; line-height: 1.3; user-select: text; }
  #cover-back dd small, #q-pop dd small { font-size: 10.5px; font-weight: 600; color: var(--s-soft); }
  #cb-chips, #q-pop .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  #cb-chips .chip, #q-pop .chip { font-size: 10px; font-weight: 600; color: var(--s-soft); padding: 3px 8px; }
  #cb-more { margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--s-accent-text); min-height: 24px; }
  @media (prefers-reduced-motion: reduce) {
    #flip-in { transition: none; }
    #flip.turned #flip-in { transform: none; }
    #flip .face { backface-visibility: visible; -webkit-backface-visibility: visible; transition: opacity 0.2s ease; }
    #cover-back { transform: none; opacity: 0; }
    #flip.turned #cover-back { opacity: 1; }
    #flip.turned #cover-btn { opacity: 0; }
  }

  /* round icon buttons (the transport) */
  .ib {
    -webkit-app-region: no-drag;
    border: 0;
    background: none;
    cursor: pointer;
    color: var(--s-text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: inline-grid;
    place-items: center;
    position: relative;
    transition: transform 0.12s ease;
  }
  .ib:hover { background: var(--s-hover); }
  .ib:active { transform: scale(0.94); }
  .ib svg { width: 16px; height: 16px; fill: currentColor; }
  .ib.small { color: var(--s-soft); }
  .ib.small svg { width: 14px; height: 14px; }
  .ib.big { width: 46px; height: 46px; }
  .ib.big svg { width: 20px; height: 20px; }
  /* on (shuffle, repeat): a dot under the icon as well as the colour, as in the mini player */
  .ib.on { color: var(--s-accent-text); }
  .ib.on::after { content: ''; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
  .ib.fill { background: var(--s-fill); color: var(--s-on-fill); }
  .ib.fill:hover { background: var(--s-fill); }
  .ib:focus { outline: none; }
  .ib:focus-visible { outline: 2px solid var(--s-ring); outline-offset: 2px; }

  #layers { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--s-edge); }
  #layers .k { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--s-soft); margin-bottom: 8px; display: block; }
  /* minmax(0, 1fr): a plain 1fr can't shrink below its words, and the third tile ran past the column under
     the lyrics (0.15.42-dev.1: only a sliver of Liner notes took the mouse) */
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .tile {
    -webkit-app-region: no-drag;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    min-width: 0;
    text-align: center;
    overflow-wrap: anywhere;
    padding: 9px 4px 8px;
    border-radius: 10px;
    border: 1px solid var(--s-edge);
    background: none;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    color: var(--s-soft);
    transition: transform 0.12s ease;
  }
  .tile:hover { background: var(--s-hover); color: var(--s-text); }
  .tile:active { transform: scale(0.97); }
  .tile svg { width: 18px; height: 18px; fill: currentColor; }
  .tile small { font-weight: 600; font-size: 10px; color: var(--s-soft); }
  .tile[aria-pressed="true"] { color: var(--s-text); border-color: var(--s-ring); }
  .tile[aria-pressed="true"] small { color: var(--s-text); }
  .tile:focus { outline: none; }
  .tile:focus-visible { outline: 2px solid var(--s-ring); outline-offset: 2px; }

  /* --- right: Up Next / Playlist --- */
  #queue { display: flex; flex-direction: column; padding: 14px 0 0; border-left: 1px solid var(--s-edge); min-width: 0; overflow: hidden; }
  #q-top { flex-shrink: 0; }
  #q-title { margin: 0; padding: 0 18px; font-size: 17px; font-weight: 800; }
  /* the next card, in the list after the song playing: a click skips to it; its length in the rows' column */
  #next-card {
    margin: 4px 0;
    padding: 10px 9px 10px 10px;
    border-radius: 12px;
    border: 1px solid var(--s-edge);
    display: flex;
    gap: 12px;
    align-items: center;
    min-height: 0;
  }
  #next-card .nt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  #next-art { flex-shrink: 0; width: 56px; height: 56px; border-radius: 7px; object-fit: cover; box-shadow: 0 4px 10px var(--s-art-shadow); }
  #next-card .k { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--s-accent-text); font-variant-numeric: tabular-nums; }
  #next-card .t { font-size: 14px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next-card .s { font-size: 11.5px; color: var(--s-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #q-top { padding-bottom: 10px; }
  #queue { position: relative; }
  #q-list li { position: relative; }
  /* a row's ⋯ (its menu, also on right-click and the Menu key): shown on hover, over the length */
  .q-menu { position: absolute; right: 6px; top: 50%; margin-top: -14px; width: 28px; height: 28px; visibility: hidden; }
  #q-list li:hover .q-menu, #q-list li:focus-within .q-menu { visibility: visible; }
  #q-list li:hover .q-row .d, #q-list li:focus-within .q-row .d { visibility: hidden; }
  .q-more { padding: 6px 10px; font-size: 11px; font-weight: 600; color: var(--s-soft); }
  /* the "Track N of M" chip: the row playing answers with a short glow (opacity only, once) */
  .q-row.flash::after { content: ''; position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 2px var(--s-ring); background: var(--s-active); pointer-events: none; animation: q-flash 1.4s ease-out forwards; }
  @keyframes q-flash { from { opacity: 1; } to { opacity: 0; } }
  /* another song's credits (a row's menu): a small popover over the list */
  #q-pop { position: absolute; left: 14px; right: 14px; z-index: 5; max-height: 60%; overflow: auto; padding: 10px 12px 12px; border-radius: 12px; border: 1px solid var(--s-edge); background: var(--s-surface); box-shadow: 0 12px 30px var(--s-shadow); -webkit-app-region: no-drag; }
  #q-list {
    -webkit-app-region: no-drag;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    list-style: none;
    margin: 0;
    padding: 0 8px 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--s-track) transparent;
  }
  .q-row {
    position: relative;
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 40px;
    padding: 6px 10px;
    border: 0;
    border-radius: 8px;
    background: none;
    color: var(--s-text);
    font: inherit;
    font-size: 13px;
    text-align: left;
  }
  button.q-row { cursor: pointer; }
  button.q-row:hover { background: var(--s-hover); }
  button.q-row:focus { outline: none; }
  button.q-row:focus-visible { outline: 2px solid var(--s-ring); outline-offset: -2px; }
  .q-row .n { font-size: 11px; font-weight: 600; color: var(--s-soft); text-align: right; font-variant-numeric: tabular-nums; }
  .q-row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-row .t small { display: block; font-size: 11px; font-weight: 500; color: var(--s-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-row .d { font-size: 11px; font-weight: 600; color: var(--s-soft); font-variant-numeric: tabular-nums; }
  .q-row.cur { box-shadow: inset 3px 0 0 var(--s-ring); }
  .q-row.played .t { color: var(--s-soft); }
  /* the song playing: three still bars (no endless animation: nothing runs while idle) */
  .q-row .eq { display: inline-flex; gap: 2px; align-items: flex-end; justify-content: flex-end; height: 11px; }
  .q-row .eq i { width: 3px; border-radius: 1px; background: var(--s-accent-text); height: 11px; }
  .q-row .eq i:nth-child(1) { height: 6px; }
  .q-row .eq i:nth-child(3) { height: 8px; }
  #q-note { padding: 6px 18px 8px; font-size: 11px; font-weight: 600; color: var(--s-soft); }
  #q-foot { flex-shrink: 0; display: flex; justify-content: space-between; gap: 8px; padding: 10px 18px 12px; border-top: 1px solid var(--s-edge); font-size: 11px; font-weight: 600; color: var(--s-soft); }
  #q-foot span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>

<body>
  <div id="card">
    <!-- the stage form (body.stage, stage-ui.js): the song and the transport on the left -->
    <section id="np" aria-label="Now playing" hidden>
      <!-- the cover: a click turns it over (a CD case) to the song's credits (stage-ui.js; transform only) -->
      <div id="flip" hidden>
        <div id="flip-in">
          <button id="cover-btn" class="face front" aria-expanded="false" aria-controls="cover-back" aria-label="Credits" aria-keyshortcuts="C" title="Credits (C): turn the cover over to see who wrote, played and produced this song">
            <img id="cover" alt="" hidden>
            <span id="flip-hint" aria-hidden="true"></span>
          </button>
          <div id="cover-back" class="face back" role="region" aria-label="Song credits" inert>
            <div class="cb-top"><span class="k">Credits</span><button id="cb-close" class="ib small" aria-label="Show the cover" title="Show the cover (Esc)"></button></div>
            <dl id="cb-rows"></dl>
            <div id="cb-chips"></div>
            <button id="cb-more" class="lnk" aria-label="More in the liner notes" title="Open the album's booklet at its Credits page" hidden>More in the liner notes</button>
          </div>
        </div>
      </div>
      <h1><button id="np-title" class="lnk" aria-label="Song: open its album" title="Open the album in Apple Music"></button></h1>
      <button id="np-artist" class="lnk" aria-label="Artist: open in Apple Music" title="Open the artist in Apple Music"></button>
      <button id="np-album" class="lnk" aria-label="Album: open in Apple Music" title="Open the album in Apple Music"></button>
      <div id="where">
        <button id="chip-track" class="chip count" aria-label="Show the song playing in the list" title="Show the song playing in the list" hidden><i aria-hidden="true"><b></b></i><span></span></button>
        <button id="chip-live" class="chip live" aria-label="Live recording: open the liner notes at the recording" title="Open the liner notes at the recording" hidden><span></span></button>
      </div>
      <div id="seek">
        <div id="seek-bar" class="bar" role="slider" tabindex="0" aria-label="Song position" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><i id="seek-fill"></i><span id="seek-run"><b></b></span><span id="seek-tip" aria-hidden="true" hidden><b></b><span></span></span></div>
        <div class="times" aria-hidden="true"><span id="t-el">0:00</span><span id="t-rem"></span></div>
      </div>
      <div id="transport">
        <button id="b-shuffle" class="ib small" title="Shuffle" aria-label="Shuffle" aria-pressed="false"></button>
        <button id="b-prev" class="ib" title="Previous" aria-label="Previous"></button>
        <button id="b-play" class="ib big fill" title="Play" aria-label="Play"></button>
        <button id="b-next" class="ib" title="Next" aria-label="Next"></button>
        <span class="rep"><button id="b-repeat" class="ib small" title="Repeat" aria-label="Repeat: off" aria-pressed="false"></button><span id="repeat-one" aria-hidden="true" hidden>1</span></span>
      </div>
      <div id="vol"><span id="i-vol" aria-hidden="true"></span><div id="vol-bar" class="bar" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="vol-fill"></i><span id="vol-run"><b></b></span></div></div>
      <!-- the song's actions (song-actions.js through main); each says what it did under the row -->
      <div id="acts" role="group" aria-label="Song actions">
        <button id="a-fav" class="ib act" aria-pressed="false" aria-label="Favorite" aria-keyshortcuts="F" title="Favorite (F)"></button>
        <button id="a-lib" class="ib act" aria-label="Add to Library" title="Add to Library"></button>
        <button id="a-pl" class="ib act" aria-haspopup="menu" aria-label="Add to a Playlist" title="Add to a Playlist"></button>
        <button id="a-link" class="ib act" aria-label="Copy Link" title="Copy the song's Apple Music link"></button>
        <button id="a-album" class="ib act" aria-label="Go to Album" title="Go to the album in Apple Music"></button>
        <button id="a-artist" class="ib act" aria-label="Go to Artist" title="Go to the artist in Apple Music"></button>
        <button id="a-more" class="ib act" aria-haspopup="menu" aria-label="More" title="More: View Album Cover, Liner Notes, Share"></button>
      </div>
      <div id="act-slot"><div id="act-note" aria-hidden="true"></div></div>
      <!-- the stage's layers: each tile shows only when it does something (no dead controls) -->
      <div id="layers" hidden>
        <span class="k">In the Studio</span>
        <div class="tiles">
          <button id="t-notes" class="tile" aria-label="Sheet notes" aria-pressed="false" title="The sung melody as notes above the lyrics, in sync (Experimental): click to turn on" hidden><span class="ti"></span>Sheet notes<small>Off</small></button>
          <!-- Montage: shown with the Studio (montage-ui.js); says when it finds no free photos -->
          <button id="t-montage" class="tile" aria-label="Montage" aria-pressed="false" title="Related photos drifting behind the lyrics" hidden><span class="ti"></span>Montage<small>Off</small></button>
          <button id="t-liner" class="tile" aria-label="Liner notes" title="Open the album's booklet: credits, notes, the venue" hidden><span class="ti"></span>Liner notes<small>Booklet</small></button>
        </div>
      </div>
    </section>
    <!-- the Studio's Montage (montage-ui.js): behind the centre column, only when on with photos -->
    <div id="montage" aria-hidden="true" hidden><img class="mt-photo" alt=""><img class="mt-photo" alt=""><div class="mt-scrim"></div></div>
    <div id="header">
      <div id="art" title="Show album (right-click: View Album Cover)" role="button" tabindex="0" aria-label="Show album" aria-haspopup="menu">
        <svg id="ring" viewBox="0 0 34 34"><circle class="track" cx="17" cy="17" r="16"/><circle class="fill" cx="17" cy="17" r="16"/></svg>
        <div id="spin"><img id="thumb" alt=""></div>
        <div id="tonearm" class="lifted" aria-hidden="true">
          <div id="arm">
            <svg viewBox="0 0 62 62"><g transform="translate(1.1 1.5)"><line x1="58" y1="0" x2="58" y2="30" stroke="var(--s-tonearm-shadow)" stroke-width="2.2" stroke-linecap="round"/><rect x="55.4" y="29.5" width="3.6" height="6.5" rx="0.9" fill="var(--s-tonearm-shadow)" transform="rotate(10 57.2 32.75)"/></g></svg>
            <div id="lift"><svg viewBox="0 0 62 62"><rect x="55.5" y="-5" width="5" height="5.5" rx="1.2" fill="var(--s-tonearm-head)" stroke="var(--s-tonearm)" stroke-width="0.5"/><line x1="58" y1="0" x2="58" y2="30.5" stroke="var(--s-tonearm-edge)" stroke-width="2.4" stroke-linecap="round"/><line x1="58" y1="0" x2="58" y2="30.5" stroke="var(--s-tonearm)" stroke-width="1.5" stroke-linecap="round"/><rect x="55.4" y="29.5" width="3.6" height="6.5" rx="0.9" fill="var(--s-tonearm-head)" stroke="var(--s-tonearm)" stroke-width="0.5" transform="rotate(10 57.2 32.75)"/></svg></div>
          </div>
          <svg viewBox="0 0 62 62"><circle cx="58" cy="4" r="3.8" fill="var(--s-tonearm-head)" stroke="var(--s-tonearm)" stroke-width="0.8"/><circle cx="58" cy="4" r="1.3" fill="var(--s-tonearm)"/></svg>
        </div>
      </div>
      <div id="song"><span class="t">Lyrics</span><span class="a"></span></div>
      <div id="ctx" hidden></div>
      <button id="form" aria-label="Studio" aria-pressed="false" aria-keyshortcuts="Control+Shift+S" title="Open the Studio: the lyrics with the song and what plays next (Ctrl+Shift+S)"></button>
      <button id="close" title="Close (Esc)" aria-label="Close lyrics">
        <svg viewBox="0 0 16 16"><path d="M3.28 2.22a.75.75 0 0 0-1.06 1.06L6.94 8l-4.72 4.72a.75.75 0 1 0 1.06 1.06L8 9.06l4.72 4.72a.75.75 0 1 0 1.06-1.06L9.06 8l4.72-4.72a.75.75 0 0 0-1.06-1.06L8 6.94 3.28 2.22z"/></svg>
      </button>
    </div>
    <!-- the sheet-notes band (the +1, Experimental) above the words: only with its switch on (the Sheet notes tile) -->
    <div id="band" role="group" aria-label="Sheet notes" hidden></div>
    <div id="lines" role="group" aria-label="Lyrics" aria-description="Up and Down move between lines, Enter plays from a line"><div id="empty">Play a song to see its lyrics</div></div>
    <button id="mt-credit" aria-label="Photo credit" hidden><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 3h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm.5 8.5h11L10 7l-2.5 3L6 8.5zM5 7a1.25 1.25 0 1 0 0-2.5A1.25 1.25 0 0 0 5 7z"/></svg><span></span></button>
    <!-- the stage form: what plays next on the right -->
    <section id="queue" aria-labelledby="q-title" hidden>
      <div id="q-top">
        <h2 id="q-title">Up Next</h2>
      </div>
      <!-- one list: the songs played (dimmed), the one playing, the next card, then the rest (stage-model queueList) -->
      <ul id="q-list" aria-label="Up Next" aria-description="Up and Down move between songs, Enter plays one, the Menu key opens its menu"></ul>
      <button id="next-card" class="q-row q-next" aria-label="Skip to the next song" hidden>
        <img id="next-art" alt="" hidden>
        <span class="nt"><span class="k" id="next-in">Next</span><span class="t" id="next-t"></span><span class="s" id="next-s"></span></span>
        <span class="d" id="next-d"></span>
      </button>
      <div id="q-pop" role="dialog" aria-labelledby="q-pop-t" hidden><div class="cb-top"><span class="k" id="q-pop-t">Credits</span><button id="q-pop-x" class="ib small" aria-label="Close credits" title="Close (Esc)"></button></div><dl></dl><div class="chips"></div></div>
      <div id="q-note" hidden></div>
      <div id="q-foot"><span id="q-foot-l"></span><span id="q-foot-r"></span></div>
    </section>
    <div id="grip" aria-hidden="true"></div>
  </div>
  <div id="say" class="sr-only" role="status"></div>
<script>
  const { ipcRenderer } = require('electron')
  // loop: the word highlight / countdown rAF loop lives in lyrics-view.js (shared with the visualizer);
  // otherwise this page reacts to 'lyrics-time' pushes (2/s) and 'lyrics-data' (per track)
  // lifetime: OK — the seven ipcRenderer.on listeners and the visibilitychange listener are added once at
  // load and die with the window; per-track elements are owned and replaced by the view

  // the one theme system (theme.js): the card's colours and Glass material follow the album; the
  // sung line glows in the album's accent
  const theme = require('./theme-apply').attach({ surfaces: [document.getElementById('card')] })
  // lifetime: OK — 'theme' and 'palette' listeners, added once at load, released with the window
  ipcRenderer.on('theme', (event, t) => theme.set(t))
  ipcRenderer.on('palette', (event, p) => {
    // the album's accents, as the theme made them readable on this card (never the raw colours):
    // singer 1 (and one-singer songs), singer 2 in a duet, and lines sung together
    const r = document.documentElement.style
    const keys = { '--active': '--s-accent-text', '--active-2': '--s-accent-2-text', '--active-mix': '--s-accent-mix-text' }
    // loop: NOT-WORTH — 3 properties per palette change
    for (const k in keys) { if (p && p.accent) r.setProperty(k, 'var(' + keys[k] + ')'); else r.removeProperty(k) }
  })

  // album art in the header: the URL the mini player shows, so it usually comes from Chromium's
  // cache. A new cover flips in (rotateY, transform only) once it has loaded.
  // lifetime: OK — one Image per art change, dropped after load; one flip animation at a time
  const artEl = document.getElementById('art')
  const thumb = document.getElementById('thumb')
  const ringFill = artEl.querySelector('.fill')
  const RING = 2 * Math.PI * 16
  ringFill.style.strokeDasharray = String(RING)
  ringFill.style.strokeDashoffset = String(RING)
  let artUrl = ''
  // lifetime: OK — added once at load, released with the window
  ipcRenderer.on('lyrics-art', (event, url) => {
    artUrl = url || ''
    if (!artUrl) {
      artEl.classList.remove('shown')
      thumb.removeAttribute('src')
      return
    }
    const img = new Image()
    // lifetime: OK — the onload handler goes with its Image (collected after the load)
    img.onload = async () => {
      if (img.src !== artUrl) return                   // a newer track won
      const wasShown = artEl.classList.contains('shown') && thumb.getAttribute('src')
      if (!wasShown || document.visibilityState !== 'visible') {
        thumb.src = artUrl
        artEl.classList.add('shown')
        return
      }
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { thumb.src = artUrl; return }   // reduced motion: no flip
      try {
        await thumb.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(90deg)' }], { duration: 250, easing: 'ease-in' }).finished
      } catch (e) { /* error: NOT-WORTH — the flip was cancelled (a newer cover or the window closing); the cover is set below anyway */ }
      thumb.src = artUrl
      thumb.animate([{ transform: 'rotateY(-90deg)' }, { transform: 'rotateY(0deg)' }], { duration: 250, easing: 'ease-out' })
    }
    img.src = artUrl
  })
  // lifetime: OK — one click handler on the header art, released with the window
  artEl.onclick = () => ipcRenderer.send('lyrics-command', 'show-album')
  // lifetime: OK — the art's keydown (Enter/Space, a button for the keyboard) and contextmenu, and the page's
  // keydown (Esc closes, as in the visualizer), one each, released with the window. The art's menu (View Album
  // Cover, Show Album) opens on right-click, the Menu key or Shift+F10
  artEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); artEl.click() } })
  artEl.addEventListener('contextmenu', (e) => { e.preventDefault(); if (artUrl) ipcRenderer.send('lyrics-command', 'art-menu') })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !e.ctrlKey && !e.altKey && !e.shiftKey) ipcRenderer.send('lyrics-command', 'close') })

  // progress ring: song position / duration, written at most 4×/s and only when it moved
  let duration = 0
  let ringAt = 0
  let ringShown = -1
  function updateRing(time, force) {
    const now = performance.now()
    if (!force && now - ringAt < 250) return
    ringAt = now
    const p = duration > 0 ? Math.min(1, Math.max(0, time / duration)) : 0
    const offset = Math.round(RING * (1 - p) * 10) / 10
    if (offset === ringShown) return
    ringShown = offset
    ringFill.style.strokeDashoffset = String(offset)
  }

  // loop: album art spin · CSS animation (rotate at record speed: 33⅓ rpm = 1.8 s per turn for
  // albums, 45 rpm = 1.333 s for singles/EPs; compositor only) · runs only with
  // Settings → "Spin album art like a record" on (off by default), art shown, window visible and
  // music playing · paused via animation-play-state when hidden or paused · cost in docs/PERFORMANCE.md
  let spin = false
  let relaxed = true      // Settings → Record speed: Relaxed (default, ¼ of true speed) or True
  let single = false
  function applyTurn() {
    const turn = (single ? 60 / 45 : 60 / (100 / 3)) * (relaxed ? 4 : 1)
    document.body.style.setProperty('--turn', turn.toFixed(3) + 's')
  }
  // lifetime: OK — added once at load, released with the window
  ipcRenderer.on('lyrics-settings', (event, s) => {
    relaxed = !(s && s.speed === 'true')
    applyTurn()
    spin = !!(s && s.spin)
    document.body.classList.toggle('spin', spin)
    updateStill()
  })
  function updateStill() {
    document.body.classList.toggle('still', document.visibilityState !== 'visible' || !view.playing)
    syncArm()
  }

  // the tonearm (see its CSS): one Web Animation from where the arm is to the record's last groove,
  // timed to the song's remaining length, rebuilt only on play, seek (> 1.5 s off), a new song or the
  // window showing again; paused (frozen, lifted) on pause, when hidden or with the spin off.
  // loop: NOT-WORTH — no loop of its own: a compositor animation (transform only) while the record
  // spins, playing and shown, where the spin already redraws the record every frame; nothing paused or hidden
  // lifetime: OK — one Animation at a time (the old one cancelled before a new one), one swing timer at a time
  const ARM_REST = -8, ARM_OUT = 1.5, ARM_IN = 10.5   // degrees: off the record, the first groove, the last
  const SWING = 0.6                                   // s: back to the first groove for a new song
  const tonearm = document.getElementById('tonearm')
  const armEl = document.getElementById('arm')
  let arm = null              // { anim, at: song time it started from, perf: when, playing }
  let armAngle = ARM_REST     // where the arm is when no animation moves it
  let armSong = 0             // bumps on each new song: the arm swings back first
  let armSwung = -1
  let swingTimer = 0
  const armFor = (t) => duration > 0 ? ARM_OUT + (ARM_IN - ARM_OUT) * Math.min(1, Math.max(0, t / duration)) : ARM_REST
  function armNow() {
    if (!arm) return armAngle
    const el = arm.anim.effect && arm.anim.effect.getComputedTiming()
    const p = el && el.progress !== null ? el.progress : 1
    if (p < arm.f) return arm.from + (arm.to - arm.from) * (p / arm.f)
    return arm.to + (ARM_IN - arm.to) * (arm.f < 1 ? (p - arm.f) / (1 - arm.f) : 1)
  }
  function stopArm() {
    if (!arm) return
    armAngle = armNow()
    arm.anim.cancel()
    arm = null
    armEl.style.transform = 'rotate(' + armAngle.toFixed(2) + 'deg)'
  }
  function syncArm() {
    const live = spin && artEl.classList.contains('shown') && document.visibilityState === 'visible' && duration > 0
    const playing = live && view.playing
    const t = view.time()
    const ended = t >= duration - 0.25
    tonearm.classList.toggle('lifted', !playing || ended || swingTimer !== 0)
    if (!playing || ended) { stopArm(); return }
    const newSong = armSwung !== armSong
    if (arm && !newSong) {
      const expected = arm.at + (performance.now() - arm.perf) / 1000
      if (Math.abs(expected - t) < 1.5) return          // still in step
    }
    // from where the arm is: a quick swing (a new song or a seek) to the song's groove, then linear to the end
    const from = armNow()
    stopArm()
    const target = armFor(t)
    const swing = newSong ? SWING : Math.abs(target - from) > 0.3 ? 0.35 : 0
    const remaining = Math.max(0.1, duration - t)
    const total = swing + remaining
    const f = swing / total
    const rot = (a) => 'rotate(' + a.toFixed(2) + 'deg)'
    const anim = armEl.animate([{ transform: rot(from), offset: 0, easing: 'ease-in-out' }, { transform: rot(target), offset: f, easing: 'linear' }, { transform: rot(ARM_IN), offset: 1 }], { duration: total * 1000, fill: 'forwards' })
    arm = { anim, at: t, perf: performance.now(), from, to: target, f }
    if (newSong) {
      armSwung = armSong
      clearTimeout(swingTimer)
      // loop: NOT-WORTH — one-shot, once per new song: sets the arm down when the swing ends
      swingTimer = setTimeout(() => { swingTimer = 0; tonearm.classList.toggle('lifted', !view.playing) }, swing * 1000)
      tonearm.classList.add('lifted')
    }
  }

  // lifetime: OK — one click handler, released with the window
  document.getElementById('close').onclick = () => ipcRenderer.send('lyrics-command', 'close')

  // the lyrics engine (model, clock, word timing, rendering) is shared with the visualizer overlay
  const linesEl = document.getElementById('lines')

  // #grip (see its CSS): one drag patch per area a scrolled list can cover, with a hole per control in it.
  // The lyrics window: the header (holes: the cover, the stage button, the close button). The stage adds
  // the sheet-notes band (over the lyrics) and the queue's head (over its list). Placed again on any
  // change of those areas' sizes (window resize, the cover shown or hidden, a two-line title, the form
  // changing, the queue's tab switching the next card).
  // lifetime: OK — four ResizeObservers (header, cover, band, queue head) for the window's life, released with it
  const gripEl = document.getElementById('grip')
  const headerEl = document.getElementById('header')
  const CONTROLS = 'button, [role=button], [role=slider], [tabindex="0"], a[href], input'
  function placeGrip() {
    const card = document.getElementById('card').getBoundingClientRect()
    const place = (el, r, from) => { el.style.left = (r.left - from.left) + 'px'; el.style.top = (r.top - from.top) + 'px'; el.style.width = r.width + 'px'; el.style.height = r.height + 'px' }
    const shown = (el) => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 ? r : null }
    const patches = []
    // loop: NOT-WORTH — at most 3 areas and their few controls, once per resize of one of them, never per frame
    for (const area of [headerEl, document.getElementById('band'), document.getElementById('q-top')]) {
      const r = shown(area)
      if (!r) continue
      const ga = document.createElement('div')
      ga.className = 'ga'
      place(ga, r, card)
      for (const c of area.querySelectorAll(CONTROLS)) {
        const cr = shown(c)
        if (!cr) continue
        const hole = document.createElement('i')
        place(hole, cr, r)
        ga.appendChild(hole)
      }
      patches.push(ga)
    }
    gripEl.replaceChildren(...patches)
  }
  let sheetBand = null     // the Studio's sheet-notes band (below), once made
  // lifetime: OK — the five ResizeObservers below live as long as the window
  new ResizeObserver(placeGrip).observe(headerEl)
  new ResizeObserver(placeGrip).observe(artEl)
  new ResizeObserver(placeGrip).observe(document.getElementById('band'))
  // the band's width changed (a resize, the form): its playhead and strip placed again from the clock
  new ResizeObserver(() => { if (sheetBand) sheetBand.relayout() }).observe(document.getElementById('band'))
  new ResizeObserver(placeGrip).observe(document.getElementById('q-top'))
  // Settings → Experimental graphics → HDR output: the sung word glows brighter than SDR white on an HDR screen
  // (hdr-glow.js; nothing exists while main says this window isn't on one)
  const hdrGlow = require('./hdr-glow').createHdrGlow(document)
  // lifetime: OK — added once at load, released with the window
  ipcRenderer.on('lyrics-hdr', (event, s) => hdrGlow.set(s))
  window.__sonataHdr = hdrGlow.state
  const view = require('./lyrics-view').createLyricsView({
    container: linesEl,
    onSung: (el) => hdrGlow.sung(el),
    layout: 'scroll',
    // the sung line: in the middle of the lyrics window; a third of the way down on the stage
    anchor: () => (document.body.classList.contains('stage') ? 0.34 : 0.5),
    notes: true,
    credits: true,
    onSeek: (t) => ipcRenderer.send('lyrics-command', 'seek', t),
    // Expressive words' line: Install / Show open Settings → Precise timing (main.js 'expressive')
    onExpressive: () => ipcRenderer.send('lyrics-command', 'expressive'),
    // the sheet notes "Over the sung line": the room above the sung line, and where it is now
    room: () => (sheetBand && stage.shown ? sheetBand.room : 0),
    onRoom: (el) => placeOver(el),
    onFrame: (time) => updateRing(time),
    // what is true about each source (lyrics-view.js statusText: ≤ 60 characters, the rest behind the ⓘ)
    emptyText: (data) => require('./lyrics-view').statusText(data)
  })

  // lifetime: OK — the lyrics feed's listeners ('lyrics-data', '-refined', '-aligned', '-time'), added once at load, released with the window
  ipcRenderer.on('lyrics-data', (event, data) => {
    // record speed for the spin: singles and EPs were 7" 45s, albums 33⅓ LPs
    single = / - (Single|EP)$/i.test(data.album || '')
    applyTurn()
    duration = Number(data.duration) || 0
    updateRing(0, true)
    armSong++
    stopArm()
    const songEl = document.getElementById('song')
    songEl.querySelector('.t').textContent = data.title || 'Lyrics'
    songEl.querySelector('.a').textContent = data.title ? (data.artist || '') : ''
    songEl.title = data.title ? data.title + (data.artist ? ' — ' + data.artist : '') : ''
    // a new song starts at the top at once: the list's scroll-behavior is smooth, and a smooth scroll back up
    // from the last song's end ran through every line (0.15.42)
    linesEl.scrollTo({ top: 0, left: 0, behavior: 'instant' })
    view.setData(data)
    // screen readers hear the lyrics' state once per song (no lyrics, service busy), never the lines
    const empty = linesEl.querySelector('#empty .say')
    const say = document.getElementById('say')
    const text = data.title && empty ? empty.textContent : ''
    if (say.textContent !== text) say.textContent = text
  })

  // lifetime: OK — see 'lyrics-data' above
  ipcRenderer.on('lyrics-refined', (event, msg) => view.refine(msg))
  ipcRenderer.on('lyrics-aligned', (event, msg) => view.align(msg))
  ipcRenderer.on('lyrics-stream', (event, msg) => view.stream(msg))   // look-ahead play: words committed while the song plays
  ipcRenderer.on('lyrics-align-state', (event, text) => view.alignState(text))
  ipcRenderer.on('lyrics-expr-note', (event, note) => view.exprNote(note))   // Expressive words' line (lyrics-view.js showXNote)
  ipcRenderer.on('lyrics-expr', (event, msg) => view.express(msg))   // first play: a section's Expressive words, at a line boundary (lyrics-view.js express)

  // the song clock's snapshot (song-clock.js, main's one clock for every view and the band)
  // lifetime: OK — see 'lyrics-data' above
  ipcRenderer.on('lyrics-time', (event, clock) => {
    view.setTime(clock)
    updateStill()
    if (document.visibilityState === 'visible') updateRing(view.time())
  })

  // lifetime: OK — one listener for the window's life (the view keeps its own for the word animation)
  document.addEventListener('visibilitychange', updateStill)

  // --- the Studio's Montage (montage-ui.js): free photos behind the lyrics; main finds them ('stage-montage') ---
  // Made before the stage below: its 'lyrics-form' listener shows the Montage tile first, so the stage's
  // own one (the layer tiles' row, shown when any tile is) sees it.
  const montage = require('./montage-ui').createMontage({
    doc: document,
    theme,
    send: (command, value) => ipcRenderer.send('stage-command', command, value),
    say: (text) => { document.getElementById('say').textContent = text }
  })
  // lifetime: OK — the Montage's five listeners (form, state, time, theme; the colour scheme's change), added once at load, released with the window
  ipcRenderer.on('lyrics-form', (event, f) => montage.setForm(!!(f && f.stage)))
  ipcRenderer.on('stage-montage', (event, m) => montage.setState(m))
  ipcRenderer.on('lyrics-time', () => montage.setPlaying(view.playing && document.body.classList.contains('stage')))
  ipcRenderer.on('theme', () => montage.reshade())
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => montage.reshade())

  // --- the stage: the lyrics window grown into the now-playing screen (stage-ui.js, stage-model.js) ---
  // Main sends the form ('lyrics-form': { stage, linerNotes }), and while the stage shows the song
  // ('stage-np', on change) and Apple's queue ('stage-queue'); the time comes with 'lyrics-time' above.
  // The stage button (header) and Ctrl+Shift+S switch the form; main resizes the window.
  let relayout = 0
  const stage = require('./stage-ui').createStage({
    doc: document,
    send: (command, value) => ipcRenderer.send('stage-command', command, value),
    say: (text) => { document.getElementById('say').textContent = text },
    lines: () => view.timedLines(),
    nextPhoto: () => montage.next(),
    // the layout changed: the drag grip follows, and the sung line goes back to its place once the new
    // layout has settled (one frame later)
    onLayout: () => {
      placeGrip()
      cancelAnimationFrame(relayout)
      // lifetime: OK — one pending frame at most (cancelled by the next layout change), per layout change
      relayout = requestAnimationFrame(() => { relayout = 0; placeGrip(); if (sheetBand) placeBand(); view.recenter(); if (sheetBand) sheetBand.relayout() })
    }
  })
  // --- Sheet notes in the Studio (Experimental; sheet-notes-ui.js draws, sheet-notes-model.js decides) ---
  // main sends the band's state ('lyrics-sheet': the switch, why there is nothing to draw, the song's cached
  // notes and the first play's pitch pieces when they change); the band runs on the lyrics clock
  sheetBand = require('./sheet-notes-ui').createSheetBand({
    doc: document,
    time: () => view.time(),
    rate: () => view.rate(),
    epoch: () => view.epoch(),
    playing: () => view.playing,
    duration: () => duration,
    reducedMotion: () => matchMedia('(prefers-reduced-motion: reduce)').matches,
    onPlace: (p) => ipcRenderer.send('stage-command', 'sheet-place', p),
    onLayout: () => {}
  })
  stage.setBand(sheetBand.el)
  const bandEl = document.getElementById('band')
  // where the band's staff lives: in its band above the lyrics, or "Over the sung line" in #sn-over, inside
  // the lyrics list (so it scrolls with the lines); the lyrics engine opens the room and calls placeOver
  const overEl = document.createElement('div')
  overEl.id = 'sn-over'
  overEl.setAttribute('role', 'group')
  overEl.hidden = true
  let overY = null
  function placeBand() {
    const over = !!(sheetBand.room && stage.shown)
    const home = over ? overEl : bandEl
    if (sheetBand.el.parentElement !== home) home.appendChild(sheetBand.el)
    stage.setSheet(!!sheetBand.on, sheetBand.mode === 'message', over)
    if (!over) { overEl.hidden = true; overY = null }
  }
  // the room moved to `el` (the sung line, or the countdown standing for it) or went (null): #sn-over sits in
  // it; on a line change it travels there by one transform animation (none with reduced motion)
  function placeOver(el) {
    if (!el || !sheetBand.room) { overEl.hidden = true; overY = null; return }
    if (overEl.parentElement !== linesEl) linesEl.appendChild(overEl)   // a new song's lines replaced the list
    if (sheetBand.el.parentElement !== overEl) overEl.appendChild(sheetBand.el)
    const y = el.offsetTop
    const was = overY
    overY = y
    overEl.hidden = false
    overEl.style.transform = 'translateY(' + y + 'px)'
    if (was !== null && was !== y && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      // lifetime: OK — a 300 ms one-shot per line change, finished on its own (transform only: compositor)
      overEl.animate([{ transform: 'translateY(' + was + 'px)' }, { transform: 'translateY(' + y + 'px)' }], { duration: 300, easing: 'ease' })
    }
    sheetBand.relayout()
  }
  // lifetime: OK — one listener, added once at load, released with the window
  ipcRenderer.on('lyrics-sheet', (event, st) => {
    sheetBand.setState(st)
    placeBand()
    view.recenter()   // the room above the sung line opens, moves or goes with the placement
    const d = sheetBand.debug()
    const said = 'Sheet notes, experimental' + (d.label ? ': ' + d.label : '') + (d.info ? '. ' + d.info : d.msg ? '. ' + d.msg : '')
    bandEl.setAttribute('aria-label', said)
    overEl.setAttribute('aria-label', said)
    sheetBand.relayout()
  })
  // lifetime: OK — one click handler on the stage button, released with the window
  document.getElementById('form').onclick = () => ipcRenderer.send('stage-command', 'form', stage.shown ? 'compact' : 'stage')
  // lifetime: OK — the stage's nine listeners ('lyrics-form', 'stage-np', 'stage-queue', 'stage-liner', 'stage-song',
  // 'stage-credits', 'stage-said', 'stage-row-credits', 'stage-flip'), added once at load, released with the window
  ipcRenderer.on('lyrics-form', (event, f) => stage.setForm(f))
  ipcRenderer.on('stage-song', (event, st) => stage.setSong(st))
  ipcRenderer.on('stage-credits', (event, c) => stage.setCredits(c))
  ipcRenderer.on('stage-said', (event, n) => stage.said(n))
  ipcRenderer.on('stage-row-credits', (event, c) => stage.rowCredits(c))
  ipcRenderer.on('stage-flip', (event, on) => stage.flip(!!on))
  // the Montage's photo: a click on the lyrics' empty space (never on a line) shows the next photo
  // lifetime: OK — one click listener on the lyrics list, released with the window
  linesEl.addEventListener('click', (e) => { if (stage.shown && !e.target.closest('.line, button, a')) montage.next() })
  ipcRenderer.on('stage-liner', (event, ok) => stage.linerFound(ok))
  ipcRenderer.on('stage-np', (event, np) => stage.setNowPlaying(np))
  ipcRenderer.on('stage-queue', (event, q) => stage.setQueue(q))
  ipcRenderer.on('lyrics-time', (event, playbackTime) => { if (stage.shown) { stage.setTime(view.time()); sheetBand.setTime() } })
  // the window resized (the form switched, or the user resized it): the sung line back to its place
  // lifetime: OK — one ResizeObserver on the lyrics list for the window's life
  new ResizeObserver(() => { if (!relayout) relayout = requestAnimationFrame(() => { relayout = 0; view.recenter() }) }).observe(linesEl)
</script>
</body>
</html>
