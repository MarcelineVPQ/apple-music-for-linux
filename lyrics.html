<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="lyrics-view.css">
<style>
  /* colours: the theme tokens (theme.css / theme.js); the card is the shared Glass material */
  :root {
    --fg-dim: var(--s-dim);    /* lines not being sung: faded, but >= 3:1 on the card (theme.js) */
    --active: var(--s-text);   /* the sung line; the album accent as text (>= 4.5:1) while Adaptive album color is on */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: transparent; height: 100%; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Ubuntu, Cantarell, sans-serif;
    padding: 4px;
    -webkit-app-region: drag;
  }
  #card {
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--s-over-page);
    border: 1px solid var(--s-edge);
    border-radius: 16px;
    color: var(--s-text);
    overflow: hidden;
  }
  /* album art as a little vinyl record: grooved black disc, the cover as its centre label and a
     spindle hole, inside a progress ring; click shows the album in the main window */
  #art {
    -webkit-app-region: no-drag;
    flex-shrink: 0;
    position: relative;
    width: 62px;
    height: 62px;
    display: none;
    cursor: pointer;
    perspective: 200px;
  }
  #art.shown { display: block; }
  #ring { position: absolute; inset: 0; width: 62px; height: 62px; transform: rotate(-90deg); }
  #ring circle { fill: none; stroke-width: 1.2; }
  #ring .track { stroke: var(--s-edge); }
  #ring .fill { stroke: var(--active); stroke-linecap: round; }
  #spin {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    overflow: hidden;
    /* grooves: fine concentric rings; a faint sheen so the turn reads like real vinyl */
    background:
      conic-gradient(from 20deg, transparent 0 8%, var(--s-vinyl-sheen) 12%, transparent 18% 58%,
                     var(--s-vinyl-sheen-2) 62%, transparent 68%),
      repeating-radial-gradient(circle, var(--s-vinyl-a) 0 0.7px, var(--s-vinyl-b) 0.7px 1.4px);
    box-shadow: 0 1px 4px var(--s-art-shadow), inset 0 0 0 1px var(--s-vinyl-rim);
  }
  body.spin #spin { animation: spin var(--turn, 1.8s) linear infinite; }
  body.spin.still #spin { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* the label: the album cover, kept large (78 %) so the art stays readable; the grooves
     show as a vinyl rim around it */
  #thumb {
    position: absolute;
    inset: 11%;
    width: 78%;
    height: 78%;
    box-shadow: 0 0 0 1px var(--s-art-shadow);
    display: block;
    border-radius: 50%;
    object-fit: cover;
  }
  /* spindle hole */
  #spin::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 3px;
    height: 3px;
    margin: -1.5px 0 0 -1.5px;
    border-radius: 50%;
    background: var(--s-vinyl-hole);
    box-shadow: 0 0 0 0.5px var(--s-vinyl-sheen);
  }
  #header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 8px 16px;
  }
  /* title over artist, sized to sit next to the record */
  #song { flex: 1; min-width: 0; }
  #song .t, #song .a {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #song .t { font-size: 16px; font-weight: 700; color: var(--s-text); line-height: 1.25; }
  #song .a { font-size: 13px; font-weight: 600; color: var(--s-soft); line-height: 1.3; }
  #close {
    -webkit-app-region: no-drag;
    background: none;
    border: none;
    border-radius: 6px;
    color: var(--s-soft);
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #close:hover { background: var(--s-hover); color: var(--s-text); }
  #close svg { width: 12px; height: 12px; fill: currentColor; }
  #lines {
    -webkit-app-region: no-drag;
    flex: 1;
    overflow-y: auto;
    padding: 8px 20px 40vh 20px;
    scroll-behavior: smooth;
  }
  #lines::-webkit-scrollbar { width: 0; }
  .line {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.3;
    padding: 7px 0;
    color: var(--fg-dim);
    cursor: pointer;
    transition: color 0.3s ease;
  }
  .line:hover { color: var(--s-text); }
  .line.active { color: var(--sing); }
  /* the sung line's words not reached yet: the theme's faded colour, >= 4.5:1 on the card in every
     theme, album colour and Glass (theme.js --s-upcoming), instead of lyrics-view.css's opacity 0.4,
     which left them 1.7-3:1 (near-white on the light card). Sung words take the singer's colour. */
  .line.active .w { opacity: 1; color: var(--s-upcoming); transition: transform 0.18s ease-out, color 0.25s ease; }
  .line.active .w.sung { color: var(--sing); }
  .line.plain { color: var(--s-text); cursor: default; }
  #source {
    padding: 18px 0 6px;
    font-size: 11px;
    color: var(--s-soft);
    text-align: center;
  }
  #empty {
    padding: 24px 20px;
    font-size: 13px;
    color: var(--s-soft);
    text-align: center;
  }
</style>
</head>
<body>
  <div id="card">
    <div id="header">
      <div id="art" title="Show album">
        <svg id="ring" viewBox="0 0 34 34"><circle class="track" cx="17" cy="17" r="16"/><circle class="fill" cx="17" cy="17" r="16"/></svg>
        <div id="spin"><img id="thumb" alt=""></div>
      </div>
      <div id="song"><span class="t">Lyrics</span><span class="a"></span></div>
      <button id="close" title="Close">
        <svg viewBox="0 0 16 16"><path d="M3.28 2.22a.75.75 0 0 0-1.06 1.06L6.94 8l-4.72 4.72a.75.75 0 1 0 1.06 1.06L8 9.06l4.72 4.72a.75.75 0 1 0 1.06-1.06L9.06 8l4.72-4.72a.75.75 0 0 0-1.06-1.06L8 6.94 3.28 2.22z"/></svg>
      </button>
    </div>
    <div id="lines"><div id="empty">Play a song to see its lyrics</div></div>
  </div>
<script>
  const { ipcRenderer } = require('electron')
  // loop: the word highlight / countdown rAF loop lives in lyrics-view.js (shared with the visualizer);
  // otherwise this page reacts to 'lyrics-time' pushes (2/s) and 'lyrics-data' (per track)
  // lifetime: OK — the seven ipcRenderer.on listeners and the visibilitychange listener are added once at
  // load and die with the window; per-track elements are owned and replaced by the view

  // the one theme system (theme.js): the card's colours and Glass material follow the album; the
  // sung line glows in the album's accent
  const theme = require('./theme-apply').attach({ surfaces: [document.getElementById('card')] })
  // lifetime: OK — 'theme' and 'palette' listeners, added once at load, released with the window
  ipcRenderer.on('theme', (event, t) => theme.set(t))
  ipcRenderer.on('palette', (event, p) => {
    // the album's accents, as the theme made them readable on this card (never the raw colours):
    // singer 1 (and one-singer songs), singer 2 in a duet, and lines sung together
    const r = document.documentElement.style
    const keys = { '--active': '--s-accent-text', '--active-2': '--s-accent-2-text', '--active-mix': '--s-accent-mix-text' }
    // loop: NOT-WORTH — 3 properties per palette change
    for (const k in keys) { if (p && p.accent) r.setProperty(k, 'var(' + keys[k] + ')'); else r.removeProperty(k) }
  })

  // album art in the header: the URL the mini player shows, so it usually comes from Chromium's
  // cache. A new cover flips in (rotateY, transform only) once it has loaded.
  // lifetime: OK — one Image per art change, dropped after load; one flip animation at a time
  const artEl = document.getElementById('art')
  const thumb = document.getElementById('thumb')
  const ringFill = artEl.querySelector('.fill')
  const RING = 2 * Math.PI * 16
  ringFill.style.strokeDasharray = String(RING)
  ringFill.style.strokeDashoffset = String(RING)
  let artUrl = ''
  // lifetime: OK — added once at load, released with the window
  ipcRenderer.on('lyrics-art', (event, url) => {
    artUrl = url || ''
    if (!artUrl) {
      artEl.classList.remove('shown')
      thumb.removeAttribute('src')
      return
    }
    const img = new Image()
    // lifetime: OK — the onload handler goes with its Image (collected after the load)
    img.onload = async () => {
      if (img.src !== artUrl) return                   // a newer track won
      const wasShown = artEl.classList.contains('shown') && thumb.getAttribute('src')
      if (!wasShown || document.visibilityState !== 'visible') {
        thumb.src = artUrl
        artEl.classList.add('shown')
        return
      }
      try {
        await thumb.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(90deg)' }], { duration: 250, easing: 'ease-in' }).finished
      } catch (e) { /* error: NOT-WORTH — the flip was cancelled (a newer cover or the window closing); the cover is set below anyway */ }
      thumb.src = artUrl
      thumb.animate([{ transform: 'rotateY(-90deg)' }, { transform: 'rotateY(0deg)' }], { duration: 250, easing: 'ease-out' })
    }
    img.src = artUrl
  })
  // lifetime: OK — one click handler on the header art, released with the window
  artEl.onclick = () => ipcRenderer.send('lyrics-command', 'show-album')

  // progress ring: song position / duration, written at most 4×/s and only when it moved
  let duration = 0
  let ringAt = 0
  let ringShown = -1
  function updateRing(time, force) {
    const now = performance.now()
    if (!force && now - ringAt < 250) return
    ringAt = now
    const p = duration > 0 ? Math.min(1, Math.max(0, time / duration)) : 0
    const offset = Math.round(RING * (1 - p) * 10) / 10
    if (offset === ringShown) return
    ringShown = offset
    ringFill.style.strokeDashoffset = String(offset)
  }

  // loop: album art spin · CSS animation (rotate at record speed: 33⅓ rpm = 1.8 s per turn for
  // albums, 45 rpm = 1.333 s for singles/EPs; compositor only) · runs only with
  // Settings → "Spin album art like a record" on (off by default), art shown, window visible and
  // music playing · paused via animation-play-state when hidden or paused · cost in docs/PERFORMANCE.md
  let spin = false
  let relaxed = true      // Settings → Record speed: Relaxed (default, ¼ of true speed) or True
  let single = false
  function applyTurn() {
    const turn = (single ? 60 / 45 : 60 / (100 / 3)) * (relaxed ? 4 : 1)
    document.body.style.setProperty('--turn', turn.toFixed(3) + 's')
  }
  // lifetime: OK — added once at load, released with the window
  ipcRenderer.on('lyrics-settings', (event, s) => {
    relaxed = !(s && s.speed === 'true')
    applyTurn()
    spin = !!(s && s.spin)
    document.body.classList.toggle('spin', spin)
    updateStill()
  })
  function updateStill() {
    document.body.classList.toggle('still', document.visibilityState !== 'visible' || !view.playing)
  }

  // lifetime: OK — one click handler, released with the window
  document.getElementById('close').onclick = () => ipcRenderer.send('lyrics-command', 'close')

  // the lyrics engine (model, clock, word timing, rendering) is shared with the visualizer overlay
  const linesEl = document.getElementById('lines')
  const view = require('./lyrics-view').createLyricsView({
    container: linesEl,
    layout: 'scroll',
    notes: true,
    onSeek: (t) => ipcRenderer.send('lyrics-command', 'seek', t),
    onFrame: (time) => updateRing(time),
    emptyText: (data) => !data.title ? 'Play a song to see its lyrics' : data.status === 'busy' ? 'Lyrics service busy, trying again…' : 'No lyrics available for this song'
  })

  // lifetime: OK — the lyrics feed's listeners ('lyrics-data', '-refined', '-aligned', '-time'), added once at load, released with the window
  ipcRenderer.on('lyrics-data', (event, data) => {
    // record speed for the spin: singles and EPs were 7" 45s, albums 33⅓ LPs
    single = / - (Single|EP)$/i.test(data.album || '')
    applyTurn()
    duration = Number(data.duration) || 0
    updateRing(0, true)
    const songEl = document.getElementById('song')
    songEl.querySelector('.t').textContent = data.title || 'Lyrics'
    songEl.querySelector('.a').textContent = data.title ? (data.artist || '') : ''
    songEl.title = data.title ? data.title + (data.artist ? ' — ' + data.artist : '') : ''
    linesEl.scrollTop = 0
    view.setData(data)
  })

  // lifetime: OK — see 'lyrics-data' above
  ipcRenderer.on('lyrics-refined', (event, msg) => view.refine(msg))
  ipcRenderer.on('lyrics-aligned', (event, msg) => view.align(msg))

  ipcRenderer.on('lyrics-time', (event, playbackTime, isPlaying) => {
    view.setTime(playbackTime, isPlaying)
    updateStill()
    if (document.visibilityState === 'visible') updateRing(view.time())
  })

  // lifetime: OK — one listener for the window's life (the view keeps its own for the word animation)
  document.addEventListener('visibilitychange', updateStill)
</script>
</body>
</html>
