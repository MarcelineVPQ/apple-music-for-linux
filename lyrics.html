<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: rgba(22, 22, 24, 0.88);
    --border: rgba(255, 255, 255, 0.09);
    --fg: #f5f5f7;
    --fg-dim: rgba(245, 245, 247, 0.35);
    --btn-hover: rgba(255, 255, 255, 0.12);
    --active: #f5f5f7;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: rgba(245, 245, 247, 0.9);
      --border: rgba(0, 0, 0, 0.08);
      --fg: #1d1d1f;
      --fg-dim: rgba(29, 29, 31, 0.35);
      --btn-hover: rgba(0, 0, 0, 0.08);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: transparent; height: 100%; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Ubuntu, Cantarell, sans-serif;
    padding: 4px;
    -webkit-app-region: drag;
  }
  #card {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    backdrop-filter: blur(24px);
    color: var(--fg);
    overflow: hidden;
  }
  /* album art as a little vinyl record: grooved black disc, the cover as its centre label and a
     spindle hole, inside a progress ring; click shows the album in the main window */
  #art {
    -webkit-app-region: no-drag;
    flex-shrink: 0;
    position: relative;
    width: 62px;
    height: 62px;
    display: none;
    cursor: pointer;
    perspective: 200px;
  }
  #art.shown { display: block; }
  #ring { position: absolute; inset: 0; width: 62px; height: 62px; transform: rotate(-90deg); }
  #ring circle { fill: none; stroke-width: 1.2; }
  #ring .track { stroke: var(--border); }
  #ring .fill { stroke: var(--active); stroke-linecap: round; }
  #spin {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    overflow: hidden;
    /* grooves: fine concentric rings; a faint sheen so the turn reads like real vinyl */
    background:
      conic-gradient(from 20deg, transparent 0 8%, rgba(255, 255, 255, 0.10) 12%, transparent 18% 58%,
                     rgba(255, 255, 255, 0.07) 62%, transparent 68%),
      repeating-radial-gradient(circle, #141414 0 0.7px, #1f1f1f 0.7px 1.4px);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
  }
  body.spin #spin { animation: spin var(--turn, 1.8s) linear infinite; }
  body.spin.still #spin { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* the label: the album cover, kept large (78 %) so the art stays readable; the grooves
     show as a vinyl rim around it */
  #thumb {
    position: absolute;
    inset: 11%;
    width: 78%;
    height: 78%;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
    display: block;
    border-radius: 50%;
    object-fit: cover;
  }
  /* spindle hole */
  #spin::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 3px;
    height: 3px;
    margin: -1.5px 0 0 -1.5px;
    border-radius: 50%;
    background: #0b0b0b;
    box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.25);
  }
  #header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 8px 16px;
  }
  /* title over artist, sized to sit next to the record */
  #song { flex: 1; min-width: 0; }
  #song .t, #song .a {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #song .t { font-size: 16px; font-weight: 700; color: var(--fg); line-height: 1.25; }
  #song .a { font-size: 13px; font-weight: 600; color: var(--fg-dim); line-height: 1.3; }
  #close {
    -webkit-app-region: no-drag;
    background: none;
    border: none;
    border-radius: 6px;
    color: var(--fg-dim);
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #close:hover { background: var(--btn-hover); color: var(--fg); }
  #close svg { width: 12px; height: 12px; fill: currentColor; }
  #lines {
    -webkit-app-region: no-drag;
    flex: 1;
    overflow-y: auto;
    padding: 8px 20px 40vh 20px;
    scroll-behavior: smooth;
  }
  #lines::-webkit-scrollbar { width: 0; }
  .line {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.3;
    padding: 7px 0;
    color: var(--fg-dim);
    filter: blur(0.6px);
    cursor: pointer;
    transition: color 0.3s ease, filter 0.3s ease;
  }
  .line:hover { color: var(--fg); filter: none; }
  .line.active { color: var(--active); filter: none; }
  .line.plain { color: var(--fg); filter: none; cursor: default; }
  /* duets: singer 1 left, singer 2 right, together centered (one singer: as before) */
  .line.left { text-align: left; padding-right: 16%; }
  .line.right { text-align: right; padding-left: 16%; }
  .line.center { text-align: center; }
  /* karaoke words: each word reserves its bold width (hidden ::after copy), so the pop
     (GPU transform + weight) never moves the line. Word colours apply on the active line only. */
  .w {
    display: inline-flex;
    margin-inline: 0.08em;  /* a uniform extra gap, so the pop (scale 1.1) never covers a space */
    flex-direction: column;
    align-items: center;
    transform-origin: 50% 65%;
    transition: transform 0.18s ease-out, opacity 0.25s ease;
  }
  .w::after {
    content: attr(data-text);
    font-weight: 800;
    -webkit-text-stroke: 0.5px currentColor;
    height: 0;
    visibility: hidden;
    overflow: hidden;
  }
  .line.active .w { opacity: 0.4; }
  .line.active .w.sung { opacity: 1; }
  .line.active .w.now {
    opacity: 1;
    color: var(--active);
    font-weight: 800;
    -webkit-text-stroke: 0.5px currentColor;
    transform: scale(1.1);
    text-shadow: 0 0 14px var(--active), 0 0 4px var(--active);
  }
  /* background vocals: smaller and dimmer, under their line, with their own highlight */
  .bgv { font-size: 15px; font-weight: 600; line-height: 1.35; margin-top: 2px; opacity: 0.7; }
  .bgv .w::after { font-weight: 700; }
  .line.active .bgv .w.now { font-weight: 700; transform: scale(1.08); }
  /* interlude countdown: three dots in place of the next line */
  .dots {
    display: flex;
    gap: 9px;
    height: 0;
    overflow: hidden;
    opacity: 0;
    transition: height 0.3s ease, opacity 0.3s ease;
  }
  .dots.on { height: 44px; opacity: 1; overflow: visible; }
  .dots.left, .dots.plainside { justify-content: flex-start; }
  .dots.right { justify-content: flex-end; }
  .dots.center { justify-content: center; }
  .dots .row { display: flex; gap: 9px; align-items: center; transform-origin: 20px 50%; }
  .dots.right .row { transform-origin: calc(100% - 20px) 50%; }
  .dots.center .row { transform-origin: 50% 50%; }
  .dots i {
    display: block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--active);
    opacity: 0.25;
  }
  #source {
    padding: 18px 0 6px;
    font-size: 11px;
    color: var(--fg-dim);
    text-align: center;
  }
  #empty {
    padding: 24px 20px;
    font-size: 13px;
    color: var(--fg-dim);
    text-align: center;
  }
</style>
</head>
<body>
  <div id="card">
    <div id="header">
      <div id="art" title="Show album">
        <svg id="ring" viewBox="0 0 34 34"><circle class="track" cx="17" cy="17" r="16"/><circle class="fill" cx="17" cy="17" r="16"/></svg>
        <div id="spin"><img id="thumb" alt=""></div>
      </div>
      <div id="song"><span class="t">Lyrics</span><span class="a"></span></div>
      <button id="close" title="Close">
        <svg viewBox="0 0 16 16"><path d="M3.28 2.22a.75.75 0 0 0-1.06 1.06L6.94 8l-4.72 4.72a.75.75 0 1 0 1.06 1.06L8 9.06l4.72 4.72a.75.75 0 1 0 1.06-1.06L9.06 8l4.72-4.72a.75.75 0 0 0-1.06-1.06L8 6.94 3.28 2.22z"/></svg>
      </button>
    </div>
    <div id="lines"><div id="empty">Play a song to see its lyrics</div></div>
  </div>
<script>
  const { ipcRenderer } = require('electron')
  // loop: one rAF loop (word highlight / countdown dots), see wantFrames below; otherwise reacts to
  // 'lyrics-time' pushes (2/s) and 'lyrics-data' (per track)
  // lifetime: the five ipcRenderer.on listeners and the visibilitychange listener are added once at
  // load and die with the window; 'lyrics-data' replaces innerHTML, so old line, word and dot elements
  // and their onclick closures are dropped per track

  // adaptive album color: tint the card + highlight the active line (null resets)
  ipcRenderer.on('palette', (event, p) => {
    const r = document.documentElement.style
    const keys = ['--bg', '--active', '--border']
    if (!p) { keys.forEach(k => r.removeProperty(k)); return }
    r.setProperty('--bg', p.bg + 'e6')          // mostly opaque album-tinted card
    r.setProperty('--active', p.accent)         // current line glows in the accent
    r.setProperty('--border', p.accent + '33')
  })

  // album art in the header: the URL the mini player shows, so it usually comes from Chromium's
  // cache. A new cover flips in (rotateY, transform only) once it has loaded.
  // lifetime: one Image per art change, dropped after load; one flip animation at a time
  const artEl = document.getElementById('art')
  const thumb = document.getElementById('thumb')
  const ringFill = artEl.querySelector('.fill')
  const RING = 2 * Math.PI * 16
  ringFill.style.strokeDasharray = String(RING)
  ringFill.style.strokeDashoffset = String(RING)
  let artUrl = ''
  ipcRenderer.on('lyrics-art', (event, url) => {
    artUrl = url || ''
    if (!artUrl) {
      artEl.classList.remove('shown')
      thumb.removeAttribute('src')
      return
    }
    const img = new Image()
    img.onload = async () => {
      if (img.src !== artUrl) return                   // a newer track won
      const wasShown = artEl.classList.contains('shown') && thumb.getAttribute('src')
      if (!wasShown || document.visibilityState !== 'visible') {
        thumb.src = artUrl
        artEl.classList.add('shown')
        return
      }
      try {
        await thumb.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(90deg)' }], { duration: 250, easing: 'ease-in' }).finished
      } catch (e) { /* cancelled */ }
      thumb.src = artUrl
      thumb.animate([{ transform: 'rotateY(-90deg)' }, { transform: 'rotateY(0deg)' }], { duration: 250, easing: 'ease-out' })
    }
    img.src = artUrl
  })
  artEl.onclick = () => ipcRenderer.send('lyrics-command', 'show-album')

  // progress ring: song position / duration, written at most 4×/s and only when it moved
  let duration = 0
  let ringAt = 0
  let ringShown = -1
  function updateRing(time, force) {
    const now = performance.now()
    if (!force && now - ringAt < 250) return
    ringAt = now
    const p = duration > 0 ? Math.min(1, Math.max(0, time / duration)) : 0
    const offset = Math.round(RING * (1 - p) * 10) / 10
    if (offset === ringShown) return
    ringShown = offset
    ringFill.style.strokeDashoffset = String(offset)
  }

  // loop: album art spin · CSS animation (rotate at record speed: 33⅓ rpm = 1.8 s per turn for
  // albums, 45 rpm = 1.333 s for singles/EPs; compositor only) · runs only with
  // Settings → "Spin album art like a record" on (off by default), art shown, window visible and
  // music playing · paused via animation-play-state when hidden or paused · cost in docs/PERFORMANCE.md
  let spin = false
  let relaxed = true      // Settings → Record speed: Relaxed (default, ¼ of true speed) or True
  let single = false
  function applyTurn() {
    const turn = (single ? 60 / 45 : 60 / (100 / 3)) * (relaxed ? 4 : 1)
    document.body.style.setProperty('--turn', turn.toFixed(3) + 's')
  }
  ipcRenderer.on('lyrics-settings', (event, s) => {
    relaxed = !(s && s.speed === 'true')
    applyTurn()
    spin = !!(s && s.spin)
    document.body.classList.toggle('spin', spin)
    updateStill()
  })
  function updateStill() {
    document.body.classList.toggle('still', document.visibilityState !== 'visible' || !clock || !clock.playing)
  }

  document.getElementById('close').onclick = () => ipcRenderer.send('lyrics-command', 'close')

  const linesEl = document.getElementById('lines')
  const T = require('./lyrics-timing')
  const WORD_LEAD = 0.05    // s: words light up a touch early to cover the IPC hop
  let lines = []
  let lineEls = []          // per line: { el, words: [span], bg: [span], pos, bgPos }
  let interludes = []       // [{ index, start, end, el, dots: [i], row }]
  let wordTimed = false
  let live = new Set()      // lines currently .active
  let shownInterlude = -1
  let scrollTarget = null
  let clock = null
  let raf = 0

  function wordSpans(parent, words) {
    const spans = []
    words.forEach((w, i) => {
      if (i) parent.appendChild(document.createTextNode(' '))
      const span = document.createElement('span')
      span.className = 'w'
      span.dataset.text = w.text
      span.textContent = w.text
      parent.appendChild(span)
      spans.push(span)
    })
    return spans
  }

  ipcRenderer.on('lyrics-data', (event, data) => {
    // record speed for the spin: singles and EPs were 7" 45s, albums 33⅓ LPs
    single = / - (Single|EP)$/i.test(data.album || '')
    applyTurn()
    lines = data.estimate ? T.estimateWords(data.lines || []) : (data.lines || [])
    duration = Number(data.duration) || 0
    updateRing(0, true)
    lineEls = []
    interludes = []
    live = new Set()
    shownInterlude = -1
    scrollTarget = null
    stopFrames()
    const songEl = document.getElementById('song')
    songEl.querySelector('.t').textContent = data.title || 'Lyrics'
    songEl.querySelector('.a').textContent = data.title ? (data.artist || '') : ''
    songEl.title = data.title ? data.title + (data.artist ? ' — ' + data.artist : '') : ''
    linesEl.scrollTop = 0
    if (!lines.length) {
      wordTimed = false
      linesEl.innerHTML = '<div id="empty">' +
        (!data.title ? 'Play a song to see its lyrics' : data.status === 'busy' ? 'Lyrics service busy, trying again…' : 'No lyrics available for this song') + '</div>'
      return
    }
    wordTimed = T.hasWordTiming(lines)
    const sides = T.lineSides(lines)
    const gaps = T.findInterludes(lines)
    let g = 0
    linesEl.innerHTML = ''
    lines.forEach((line, i) => {
      while (g < gaps.length && gaps[g].index === i) {
        const dots = document.createElement('div')
        dots.className = 'dots ' + (sides[i] || 'plainside')
        const row = document.createElement('div')
        row.className = 'row'
        row.innerHTML = '<i></i><i></i><i></i>'
        dots.appendChild(row)
        linesEl.appendChild(dots)
        interludes.push(Object.assign({ el: dots, row, dots: [...row.children] }, gaps[g++]))
      }
      const el = document.createElement('div')
      el.className = (line.t === null ? 'line plain' : 'line') + (sides[i] ? ' ' + sides[i] : '')
      const entry = { el, side: sides[i], words: [], bg: [], pos: null, bgPos: null }
      if (line.words && line.words.length) {
        const main = document.createElement('div')
        entry.words = wordSpans(main, line.words)
        el.appendChild(main)
      }
      else el.textContent = line.text
      if (line.bg && line.bg.length) {
        const bg = document.createElement('div')
        bg.className = 'bgv'
        entry.bg = wordSpans(bg, line.bg)
        el.appendChild(bg)
      }
      if (line.t !== null) {
        el.onclick = () => {
          ipcRenderer.send('lyrics-command', 'seek', line.t)
          clock = T.seekClock(clock, line.t, performance.now())
          render(line.t)
          updateFrames()
        }
      }
      linesEl.appendChild(el)
      lineEls.push(entry)
    })
    const notes = []
    if (data.source === 'lrclib') notes.push('Lyrics from LRCLIB' + (lines[0].t === null ? ' (not time-synced)' : ''))
    if (lines.length && lines[0].estimated) notes.push('Word timing estimated')
    if (notes.length) {
      const src = document.createElement('div')
      src.id = 'source'
      src.textContent = notes.join(' · ')
      linesEl.appendChild(src)
    }
  })

  // word classes for one line's words; only touches the DOM when the position changed
  // scaled words at a row's edge grow inward, so they stay inside the window padding
  function edgeOrigin(spans, i, side) {
    const top = spans[i].offsetTop
    if (side === 'right') return i === spans.length - 1 || spans[i + 1].offsetTop !== top ? '100% 65%' : ''
    if (side === 'center') return ''
    return i === 0 || spans[i - 1].offsetTop !== top ? '0% 65%' : ''
  }

  function paintWords(spans, words, time, last, side) {
    const pos = T.wordPos(words, time)
    if (last && last.k === pos.k && last.now === pos.now) return last
    if (pos.now >= 0) spans[pos.now].style.transformOrigin = edgeOrigin(spans, pos.now, side)
    for (let i = 0; i < spans.length; i++) {
      spans[i].classList.toggle('sung', i < pos.k && i !== pos.now)
      spans[i].classList.toggle('now', i === pos.now)
    }
    return pos
  }

  function render(time) {
    if (!lines.length || lines[0].t === null) return
    const gi = T.interludeAt(interludes, time)
    const { latest, live: liveNow } = T.liveLines(lines, time)
    // during an interlude nobody sings: the dots take the next line's place
    const next = new Set(gi >= 0 ? [] : liveNow)
    for (const i of live) if (!next.has(i)) lineEls[i].el.classList.remove('active')
    for (const i of next) {
      const e = lineEls[i]
      if (!live.has(i)) { e.el.classList.add('active'); e.pos = e.bgPos = null }
      if (e.words.length) e.pos = paintWords(e.words, lines[i].words, time + WORD_LEAD, e.pos, e.side)
      if (e.bg.length) e.bgPos = paintWords(e.bg, lines[i].bg, time + WORD_LEAD, e.bgPos, e.side)
    }
    live = next
    if (gi !== shownInterlude) {
      if (shownInterlude >= 0) interludes[shownInterlude].el.classList.remove('on')
      if (gi >= 0) interludes[gi].el.classList.add('on')
      shownInterlude = gi
    }
    if (gi >= 0) {
      const g = interludes[gi]
      const { fills, exit } = T.interludeProgress(g, time)
      for (let d = 0; d < 3; d++) {
        g.dots[d].style.opacity = String(0.25 + 0.75 * fills[d])
        g.dots[d].style.transform = 'scale(' + (0.8 + 0.2 * fills[d]).toFixed(3) + ')'
      }
      const breathe = 1 + 0.06 * Math.sin(time * 2.6)
      g.row.style.transform = 'scale(' + (breathe * exit).toFixed(3) + ')'
      g.row.style.opacity = String(exit)
    }
    const target = gi >= 0 ? interludes[gi].el : (latest >= 0 ? lineEls[latest].el : null)
    if (target !== scrollTarget) {
      scrollTarget = target
      if (target) target.scrollIntoView({ block: 'center', behavior: 'smooth' })
    }
  }

  // loop: lyrics word/dot animation · requestAnimationFrame, woken by a setTimeout at the next word/line
  // change (every frame only while a countdown is showing) · runs only while this window is visible, the
  // song is playing and the lyrics have word timing (or a countdown is showing) · stops when hidden
  // (visibilitychange), paused (isPlaying false or the time stops moving), on a new track, or when no
  // word timing/countdown is left · cost: one frame per word change, DOM class writes only for what
  // changed; 3 dot styles per frame during a countdown (docs/PERFORMANCE.md)
  let wake = 0
  function wantFrames() {
    return document.visibilityState === 'visible' && !!clock && clock.playing &&
      lines.length > 0 && lines[0].t !== null && (wordTimed || shownInterlude >= 0)
  }
  function schedule(time) {
    if (shownInterlude >= 0) { raf = requestAnimationFrame(frame); return }
    const wait = T.nextChange(lines, time, WORD_LEAD)
    if (wait === Infinity) return                    // nothing left to change until the next push
    if (wait < 0.03) { raf = requestAnimationFrame(frame); return }
    wake = setTimeout(() => { wake = 0; raf = requestAnimationFrame(frame) }, (wait - 0.015) * 1000)
  }
  function frame() {
    raf = 0
    const time = T.clockTime(clock, performance.now())
    render(time)
    updateRing(time)
    if (wantFrames()) schedule(time)
  }
  function stopFrames() {
    if (raf) cancelAnimationFrame(raf)
    if (wake) clearTimeout(wake)
    raf = wake = 0
  }
  function updateFrames() {
    stopFrames()
    if (wantFrames()) schedule(T.clockTime(clock, performance.now()))
  }

  // isPlaying is sent along since 0.15.10; older pushes (undefined) fall back to "time stopped moving"
  ipcRenderer.on('lyrics-time', (event, playbackTime, isPlaying) => {
    clock = T.syncClock(clock, playbackTime, isPlaying, performance.now())
    updateStill()
    if (document.visibilityState !== 'visible') { stopFrames(); return }
    render(T.clockTime(clock, performance.now()))
    updateRing(T.clockTime(clock, performance.now()))
    updateFrames()   // re-plans the next wake-up from the resynced clock
  })

  // lifetime: one listener for the window's life
  document.addEventListener('visibilitychange', () => {
    updateStill()
    if (document.visibilityState === 'visible' && clock) render(T.clockTime(clock, performance.now()))
    updateFrames()
  })
</script>
</body>
</html>
