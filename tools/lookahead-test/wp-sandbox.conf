# WirePlumber in the look-ahead test sandbox: the policy profile (linking, default nodes, stream
# state) without anything that needs D-Bus, a seat or hardware.
wireplumber.profiles = {
  policy = {
    support.dbus = disabled
    support.system-dbus = disabled
    support.reserve-device = disabled
    support.portal-permissionstore = disabled
    support.logind = disabled
    support.mpris = disabled
    support.snap-permissions = disabled
    monitor.alsa = disabled
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
wireplumber.settings = {
  device.restore-profile = false
}
