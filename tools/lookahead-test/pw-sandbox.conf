# The private PipeWire for the look-ahead tests (tools/lookahead-test/sandbox.sh). Never run against a
# real session: sandbox.sh starts it under bwrap with a private XDG_RUNTIME_DIR and /tmp, no /dev/snd,
# no D-Bus and no network namespace. No ALSA: two null sinks stand in for output devices. The pulse
# protocol runs in this daemon (pactl and Chromium talk to it); WirePlumber (policy profile) links the
# streams and follows the default device, like on a desktop.
context.properties = {
    core.daemon = true
    core.name   = pipewire-0
    default.clock.rate          = 48000
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 2048
    link.max-buffers            = 16
    mem.allow-mlock             = false
    log.level                   = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    audio.adapt     = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-profiler }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-spa-device-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-access args = { } }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-protocol-pulse args = { } }
]

pulse.properties = {
    server.address = [ "unix:native" ]
}

stream.properties = {
    adapter.auto-port-config = { mode = dsp }
}

context.objects = [
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Dummy-Driver
            node.group      = pipewire.dummy
            priority.driver = 20000
        }
    }
    # Stand-ins for two output devices (drivers, like ALSA sinks). "speakers" is the default.
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = speakers
            node.description = "Speakers (null, test)"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            audio.rate       = 48000
            node.driver      = true
            priority.driver  = 40000
            priority.session = 2000
            object.linger    = true
            monitor.channel-volumes = true
        }
    }
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = speakers2
            node.description = "Headphones (null, test)"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            audio.rate       = 48000
            node.driver      = true
            priority.driver  = 39000
            priority.session = 1000
            object.linger    = true
        }
    }
]
