<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="lyrics-view.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; cursor: none; }
  html, body { height: 100%; overflow: hidden; background: var(--s-stage); }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Ubuntu, sans-serif;
    color: var(--s-stage-text);
    -webkit-app-region: drag;
  }
  /* the blurred album art: two layers, so a new cover crossfades by opacity (compositor) instead of
     a background-image transition (re-painted full screen on the main thread). The new cover sits
     underneath at once; the old one fades out on top. */
  #bg { position: fixed; inset: 0; z-index: 0; }
  #bg > .bgl {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: blur(64px) saturate(1.4) brightness(0.42);
    transform: scale(1.2);
    opacity: 0; z-index: 1;
    transition: opacity 0.6s ease;
  }
  #bg > .bgl.on { opacity: 1; z-index: 0; transition: none; }
  #vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 28%, var(--s-stage-vignette) 100%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #meta {
    position: fixed; left: 40px; top: 40px;
    display: flex; align-items: center; gap: 16px;
    text-shadow: 0 2px 20px var(--s-stage-shade); pointer-events: none;
  }
  #art { width: 76px; height: 76px; border-radius: 10px; object-fit: cover; box-shadow: 0 10px 40px var(--s-stage-shade-soft); flex-shrink: 0; }
  /* every stage text sits on a plate sized to it (--s-stage-plate, soft edges): the scenes' bright glows,
     bars and toasters pass behind the words without washing them out (>= 4.5:1 at the worst pixel behind,
     tools/ui-check.js every). Static: painted once per text change, nothing animates */
  #meta > div { position: relative; }
  /* the one-line notes hold their own words (no child to size a plate around): the plate is their own
     background, square so it fills their whole box, softened by its shadow */
  #hint, #audio-note, #mode-label { background: var(--s-stage-plate); box-shadow: 0 0 12px 4px var(--s-stage-plate); }
  #meta > div::before, #lyrics .w::before {
    content: ''; position: absolute; z-index: -1; inset: -6px -10px; border-radius: 12px;
    background: var(--s-stage-plate); box-shadow: 0 0 14px 2px var(--s-stage-plate);
  }
  #title { font-size: 24px; font-weight: 700; }
  #artist { font-size: 16px; opacity: 0.72; margin-top: 3px; }
  :root { --active: var(--s-stage-text); }
  /* lyrics overlay: the lyrics window's engine (lyrics-view.js, 'stage' layout). Only the line(s) being
     sung (.active, big), the countdown dots and the next line (.next, smaller) are shown, centred. */
  #lyrics { position: fixed; left: 7%; right: 7%; top: 50%; transform: translateY(-50%); text-align: center; pointer-events: none; }
  /* a soft dark scrim behind the words, so they read over busy scenes (the toasters) */
  #lyrics::before {
    content: ''; position: absolute; left: -4%; right: -4%; top: -60%; bottom: -60%; z-index: -1;
    background: radial-gradient(closest-side, var(--s-stage-scrim), transparent);
  }
  #lyrics:empty::before, #lyrics:not(:has(.line.active, .line.next, .dots.on))::before { display: none; }
  #lyrics .line {
    display: none;
    font-size: clamp(30px, 3.4vw, 132px);
    font-weight: 800;
    line-height: 1.22;
    color: var(--s-stage-text);
    text-shadow: 0 0.05em 0.45em var(--s-stage-shade), 0 0 0.12em var(--s-stage-shade-soft);
  }
  #lyrics .line.active { display: block; animation: lv-in 0.35s ease-out; }
  #lyrics .line.active + .line.active { margin-top: 0.25em; }
  #lyrics .line.next {
    display: block;
    font-size: clamp(18px, 1.9vw, 76px);
    font-weight: 600;
    color: var(--s-stage-text-quiet);   /* a colour, not opacity: the words' plates stay whole */
    margin-top: 0.6em;
    animation: lv-next 0.35s ease-out;
  }
  /* each word's plate, behind every word of its line (z-index -1: under the text, sized to the word with
     room for the pop and a rising syllable); the faded words fade by colour, not opacity, which would
     fade their plates too (lyrics-view.css: unsung words 0.4, backing vocals 0.7) */
  /* the words' plates overlap a little into one band per row (no seams between words), rounded at the
     row's ends; no soft edge here: a popped word paints above its neighbours, and a shadow would smudge them */
  #lyrics .w::before { inset: -0.3em -0.27em; border-radius: 0.08em; box-shadow: none; }
  #lyrics .w:first-of-type::before { border-top-left-radius: 0.35em; border-bottom-left-radius: 0.35em; }
  #lyrics .w:last-of-type::before { border-top-right-radius: 0.35em; border-bottom-right-radius: 0.35em; }
  #lyrics .bgv { opacity: 1; color: var(--s-stage-text-backing); }
  #lyrics .line.next .bgv { color: inherit; }
  #lyrics .line.active .w { opacity: 1; color: var(--s-stage-text-quiet); }
  #lyrics .line.active .w.sung { color: var(--s-stage-text); }
  #lyrics .line.active .bgv .w.sung { color: var(--s-stage-text-backing); }
  #lyrics .line.active .w.now { color: var(--sing); }
  #lyrics .line.active .w.now {
    text-shadow: 0 0 0.5em var(--sing), 0 0 0.15em var(--sing), 0 0.05em 0.45em var(--s-stage-shade-soft);
  }
  #lyrics .dots { --dot: clamp(12px, 1.05vw, 42px); --dot-gap: calc(var(--dot) * 0.8); --dots-h: calc(var(--dot) * 3.6); }
  /* the stage is centred: the countdown dots too, for every singer (lyrics-view.css starts them at the
     line's start in the lyrics window's list) */
  #lyrics .dots, #lyrics .dots.plainside { justify-content: center; }
  #lyrics .dots .row { transform-origin: 50% 50%; }
  /* a singer's name tag (lyrics-lanes.js, lanes on only): the stage's quiet text */
  #lyrics .line { --tag: var(--s-stage-text-quiet); }
  #lyrics .dots i { box-shadow: 0 0 0.6em var(--s-stage-shade-soft); }
  @keyframes lv-in { from { opacity: 0; transform: translateY(0.25em); } }
  @keyframes lv-next { from { opacity: 0; } }
  /* reduced motion: a new line fades in without rising (lyrics-view.css stops the pops) */
  @media (prefers-reduced-motion: reduce) { #lyrics .line.active { animation-name: lv-next; } }
  #hint { position: fixed; bottom: 16px; right: 16px; padding: 4px 8px; font-size: 12px; color: var(--s-stage-text-quiet); }
  /* the sound capture's state, when it isn't fine (visualizer.js fallback parec): plain words, top right */
  #audio-note {
    position: fixed; top: 34px; right: 30px; max-width: 480px; padding: 6px 10px; text-align: right;
    font-size: 15px; font-weight: 600; line-height: 1.4; text-shadow: 0 2px 16px var(--s-stage-shade);
    pointer-events: none;
  }
  #audio-note:empty { display: none; }
  #mode-label {
    position: fixed; bottom: 16px; left: 16px; padding: 4px 8px; font-size: 13px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; opacity: 0;
    transition: opacity 0.4s ease; text-shadow: 0 2px 12px var(--s-stage-shade);
  }
</style>
</head>
<body>
  <div id="bg"><div class="bgl"></div><div class="bgl"></div></div>
  <div id="vignette"></div>
  <canvas id="c"></canvas>
  <div id="meta">
    <img id="art" alt="">
    <div><div id="title">Not playing</div><div id="artist"></div></div>
  </div>
  <div id="lyrics"></div>
  <div id="mode-label" role="status"></div>
  <div id="hint">Click or ← → to change scene · Esc to exit</div>
  <div id="audio-note" role="status" aria-live="polite"></div>
<script>
  const { ipcRenderer } = require('electron')
  const canvas = document.getElementById('c')
  const ctx = canvas.getContext('2d')
  let W = 0, H = 0, dpr = 1
  let gate = null   // the frame gate (viz-frames.js), made below once the scenes exist
  function resize() {
    dpr = Math.min(1.5, window.devicePixelRatio || 1)   // cap for 4K perf
    W = canvas.width = Math.floor(innerWidth * dpr)
    H = canvas.height = Math.floor(innerHeight * dpr)
    ctx.clearRect(0, 0, W, H)
    if (gate) gate.kick()        // frozen (paused): redraw the still frame at the new size
  }
  // lifetime: OK — resize + ipcRenderer listeners below are added once at load and die with the window
  addEventListener('resize', resize); resize()

  // --- realtime band data + derived audio metrics ---
  // cache: OK — key=band index; invalidated=re-sliced when the band count changes; bound=band count (~48)
  let bands = [], shown = []
  window.__frames = 0
  ipcRenderer.on('viz-bands', (e, b) => { bands = b; window.__frames++; if (shown.length !== b.length) shown = b.slice() })
  // loop: HOT-PATH-OK — three passes over the bands (n ≈ 48) per animation frame; no allocation
  function stepBands() {
    const n = shown.length
    for (let i = 0; i < n; i++) shown[i] += ((bands[i] || 0) - shown[i]) * 0.35
    let e = 0, bass = 0
    for (let i = 0; i < n; i++) e += shown[i]
    for (let i = 0; i < Math.min(6, n); i++) bass += shown[i]
    return { n, energy: n ? e / n : 0, bass: bass / 6 }
  }

  // --- shared beat + BPM detector (bass-onset based) ---
  const beat = { avgBass: 0, last: 0, intervals: [], bpm: 120, hit: false }
  function detectBeat(a) {
    const now = performance.now()
    beat.avgBass = beat.avgBass * 0.92 + a.bass * 0.08
    beat.hit = false
    if (a.bass > beat.avgBass * 1.35 + 0.02 && now - beat.last > 250) {   // cap ~240 BPM
      if (beat.last) {
        beat.intervals.push(now - beat.last)
        if (beat.intervals.length > 8) beat.intervals.shift()
        // loop: HOT-PATH-OK — copy + sort of ≤ 8 intervals per detected beat (≤ 4/s), not per frame
        const s = [...beat.intervals].sort((x, y) => x - y)
        const med = s[s.length >> 1]
        const b = 60000 / med
        if (b >= 60 && b <= 190) beat.bpm = beat.bpm * 0.7 + b * 0.3
      }
      beat.last = now; beat.hit = true
    }
  }

  // --- the sound capture's state (main.js 'viz-audio-state', from visualizer.js's fallback parec) ---
  const AUDIO_NOTES = {
    restarting: 'The system sound capture stopped. Restarting it…',
    lost: 'No sound for the visualizer: the system sound capture (parec) keeps stopping. Close and reopen the visualizer to try again.',
    missing: 'No sound for the visualizer: parec is not installed (it comes with the PulseAudio utilities, e.g. pulseaudio-utils).'
  }
  // lifetime: OK — added once at load, released with the window
  ipcRenderer.on('viz-audio-state', (e, state) => { document.getElementById('audio-note').textContent = AUDIO_NOTES[state] || '' })

  // --- now playing + synced lyrics ---
  // lifetime: OK — added once at load, released with the window
  ipcRenderer.on('viz-nowplaying', (e, s) => {
    if (!s) return
    document.getElementById('title').textContent = s.title || 'Not playing'
    document.getElementById('artist').textContent = s.artist || ''
    const art = document.getElementById('art')
    if (s.artwork) { art.src = s.artwork; showBg(s.artwork) }
    art.style.display = s.artwork ? '' : 'none'
  })
  // the background crossfade: decode the new cover first, then put it underneath and fade the old out
  // lifetime: OK — one Image per cover change, dropped after decode; a newer cover wins (bgWant)
  const bgLayers = [...document.querySelectorAll('#bg > .bgl')]
  let bgWant = '', bgShown = ''
  function showBg(url) {
    if (url === bgWant) return
    bgWant = url
    const img = new Image()
    img.src = url
    // error: NOT-WORTH — a cover that fails to decode is shown anyway (the old background-image path did the same)
    img.decode().catch(() => {}).then(() => {
      if (bgWant !== url || bgShown === url) return
      const front = bgLayers.find((l) => l.classList.contains('on'))
      const next = bgLayers.find((l) => l !== front)
      next.style.backgroundImage = `url("${url}")`
      next.classList.add('on')
      if (front) front.classList.remove('on')
      bgShown = url
    })
  }
  // the lyrics: the same engine and data as the lyrics window (lyrics-view.js), laid out as a stage
  // loop: HOT-PATH-OK — its word/dot animation loop lives in lyrics-view.js (woken per word change, not per frame)
  // lifetime: OK — the four lyrics listeners below are added once at load, released with the window
  // Settings → Experimental graphics → HDR output: the sung word glows brighter than SDR white on an HDR screen (hdr-glow.js)
  const hdrGlow = require('./hdr-glow').createHdrGlow(document)
  // lifetime: OK — added once at load, released with the window
  ipcRenderer.on('lyrics-hdr', (e, s) => hdrGlow.set(s))
  window.__sonataHdr = hdrGlow.state
  const lyricsView = require('./lyrics-view').createLyricsView({ container: document.getElementById('lyrics'), layout: 'stage', onSung: (el) => hdrGlow.sung(el) })
  ipcRenderer.on('lyrics-data', (e, data) => lyricsView.setData(data))
  ipcRenderer.on('lyrics-time', (e, clock) => { lyricsView.setTime(clock); gate.setPlaying(lyricsView.playing) })
  ipcRenderer.on('lyrics-refined', (e, msg) => lyricsView.refine(msg))
  ipcRenderer.on('lyrics-aligned', (e, msg) => lyricsView.align(msg))
  // lifetime: OK — added once at load, released with the window (as the lines above)
  ipcRenderer.on('lyrics-expr', (e, msg) => lyricsView.express(msg))   // first play: a section's Expressive words (lyrics-view.js express)
  ipcRenderer.on('lyrics-stream', (e, msg) => lyricsView.stream(msg))   // look-ahead play: words committed while the song plays
  // lifetime: OK — the lyrics feed's listeners, added once at load, released with the window
  ipcRenderer.on('lyrics-align-state', (e, text) => lyricsView.alignState(text))
  // album accent for the sung word's glow (adaptive colour; null resets to white)
  // the sung word in the album's accents, lifted to 4.5:1 on the dark stage (theme.js stageText):
  // singer 1, singer 2 in a duet, and lines sung together (their halfway hue)
  const T = require('./theme')
  // lifetime: OK — added once at load, released with the window
  ipcRenderer.on('palette', (e, p) => {
    const r = document.documentElement.style
    if (!p || !p.accent) { for (const k of ['--active', '--active-2', '--active-mix']) r.removeProperty(k); return }   // loop: NOT-WORTH — 3 properties
    // singer 2 and the together colour kept apart from singer 1 for every colour vision (theme.js stageDuet)
    const [one, two, both] = T.stageDuet(p.accent, p.accent2)
    r.setProperty('--active', one)
    r.setProperty('--active-2', two)
    r.setProperty('--active-mix', both)
  })

  // prefers-reduced-motion: the scenes that travel (aurora's drift, the nebula's spin and beat bloom, the
  // flying toasters) move at REDUCED_PACE of their speed; the bars, which only rise and fall, stay as they are
  const REDUCED_PACE = 0.3
  const motionQuery = matchMedia('(prefers-reduced-motion: reduce)')
  let pace = motionQuery.matches ? REDUCED_PACE : 1
  // lifetime: OK — one change listener for the window's life
  motionQuery.addEventListener('change', () => { pace = motionQuery.matches ? REDUCED_PACE : 1 })
  window.__pace = () => pace   // for testing

  // --- mode system ---
  const MODES = ['bars', 'aurora', 'nebula', 'toast']
  let modeIdx = 0
  // error: NOT-WORTH — storage unavailable (a private profile): the first scene is shown
  try { const s = localStorage.getItem('viz-mode'); if (s && MODES.includes(s)) modeIdx = MODES.indexOf(s) } catch (e) {}
  const labelEl = document.getElementById('mode-label')
  let labelTimer = null
  function showLabel() {
    labelEl.textContent = MODES[modeIdx]
    labelEl.style.opacity = '0.85'
    clearTimeout(labelTimer)
    // loop: NOT-WORTH — mode-label fade · 1400 ms one-shot · after a mode switch · cleared before re-arming · cost ~0
    labelTimer = setTimeout(() => { labelEl.style.opacity = '0' }, 1400)
  }
  function setMode(i) {
    modeIdx = (i + MODES.length) % MODES.length
    try { localStorage.setItem('viz-mode', MODES[modeIdx]) } catch (e) {}   // error: NOT-WORTH — storage unavailable: the scene isn't remembered for next time
    ctx.clearRect(0, 0, W, H)
    aurora.streamers = null; nebula.parts = null; toast.reset = true   // re-seed on entry (toast: empty sky)
    showLabel()
    gate.kick()   // frozen (paused): draw the new scene's still frame
  }
  window.__mode = () => MODES[modeIdx]   // for testing
  // lifetime: OK — the page's key and click handlers, set once, released with the window
  document.onkeydown = (e) => {
    if (e.key === 'Escape') ipcRenderer.send('viz-close')
    else if (e.key === 'ArrowRight') setMode(modeIdx + 1)
    else if (e.key === 'ArrowLeft') setMode(modeIdx - 1)
    else if (e.key >= '1' && e.key <= String(MODES.length)) setMode(+e.key - 1)
  }
  document.onclick = () => setMode(modeIdx + 1)   // click cycles scenes; Esc exits
  showLabel()

  // --- the stage's colours and gradients (viz-paint.js) ---
  // The colours are theme.css's fixed --s-stage-* tokens (the night stage is art: the same in every theme),
  // read once at load; the scenes sweep and shift hue around them. The bars' gradients are made once and
  // reused (unit gradients mapped with the transform); the glows make theirs per fill (measured cheaper).
  const PAINT = require('./viz-paint')
  const STAGE = PAINT.readStage((name) => getComputedStyle(document.documentElement).getPropertyValue(name))
  if (STAGE.missing.length) console.error('visualizer: stage colours missing from theme.css:', STAGE.missing.join(' '))
  const glow = (x, y, radius, c, hue) => PAINT.glow(ctx, x, y, radius, c, hue)
  // lifetime: OK — 2 gradients per band, rebuilt only when the band count changes; kept for the window's life
  // cache: OK — key=band count; invalidated=rebuilt when it changes (fixed stage colours); bound=one set, 2 per band
  let barPaint = null

  // --- helpers ---
  // the bar's outline in canvas pixels (filled by the caller, through the gradient's transform)
  function roundBar(x, y, w, h) {
    const r = Math.min(w / 2, 6 * dpr)
    ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + r)
    ctx.arcTo(x, y, x + r, y, r); ctx.lineTo(x + w - r, y)
    ctx.arcTo(x + w, y, x + w, y + r, r); ctx.lineTo(x + w, y + h)
    ctx.closePath()
  }

  // --- MODE 1: bars (clean modern spectrum) ---
  function renderBars(a) {
    ctx.clearRect(0, 0, W, H)
    ctx.globalCompositeOperation = 'source-over'
    const n = a.n; if (!n) return
    if (!barPaint || barPaint.n !== n) barPaint = PAINT.barGradients(ctx, STAGE, n)
    const gap = W * 0.004, bw = (W - gap * (n - 1)) / n
    const baseY = H * 0.82, maxH = H * 0.6
    // loop: HOT-PATH-OK — one pass over the bands (n ≈ 48) per frame; the two gradients per bar are cached
    // (barPaint), each fill maps its unit gradient onto the bar with the transform; no allocation
    for (let i = 0; i < n; i++) {
      const v = shown[i], h = Math.max(2 * dpr, v * maxH), x = i * (bw + gap)
      roundBar(x, baseY - h, bw, h)
      ctx.setTransform(1, 0, 0, h, 0, baseY - h)          // unit gradient 0..1 -> the bar's top..base
      ctx.fillStyle = barPaint.body[i]; ctx.fill()
      ctx.setTransform(1, 0, 0, 1, 0, 0)
      ctx.globalAlpha = 0.18
      const mh = h * 0.6
      ctx.beginPath(); ctx.rect(x, baseY, bw, mh)
      ctx.setTransform(1, 0, 0, mh, 0, baseY)             // the mirror: the base down to 60 % of the bar
      ctx.fillStyle = barPaint.mirror[i]; ctx.fill()
      ctx.setTransform(1, 0, 0, 1, 0, 0)
      ctx.globalAlpha = 1
    }
  }

  // --- MODE 2: aurora (Flurry-style calm light streams) ---
  const aurora = { streamers: null, t: 0 }
  function renderAurora(a) {
    ctx.globalCompositeOperation = 'source-over'
    ctx.fillStyle = STAGE.trail; ctx.fillRect(0, 0, W, H)   // gentle trails
    if (!aurora.streamers) {
      aurora.streamers = []
      // loop: NOT-WORTH — 6 streamers, once per scene entry
      for (let i = 0; i < 6; i++) aurora.streamers.push({
        px: Math.random() * 6.28, py: Math.random() * 6.28,
        sx: 0.06 + Math.random() * 0.05, sy: 0.05 + Math.random() * 0.05,
        sy2: 0.02 + Math.random() * 0.03, hue: STAGE.aurora.h + i * 14
      })
    }
    aurora.t += 0.016 * (0.6 + a.energy * 2.4) * pace     // music quickens the drift
    ctx.globalCompositeOperation = 'lighter'
    // loop: HOT-PATH-OK — 6 streamers per frame, two radial gradients each (12 per frame)
    for (const s of aurora.streamers) {
      const t = aurora.t
      const x = W * (0.5 + 0.44 * Math.sin(t * s.sx + s.px))
      const y = H * (0.5 + 0.4 * Math.sin(t * s.sy + s.py) * Math.cos(t * s.sy2))
      const r = (70 + a.bass * 420) * dpr
      glow(x, y, r, STAGE.aurora, s.hue + a.energy * 40)
      glow(x, y, r * 0.4, STAGE.auroraCore, s.hue + (STAGE.auroraCore.h - STAGE.aurora.h))
    }
    ctx.globalCompositeOperation = 'source-over'
  }

  // --- MODE 3: nebula (Magnetosphere-style particle field, blooms on beats) ---
  const nebula = { parts: null, rot: 0, pulse: 0 }
  function renderNebula(a) {
    ctx.globalCompositeOperation = 'source-over'
    ctx.fillStyle = STAGE.trailShort; ctx.fillRect(0, 0, W, H)
    if (!nebula.parts) {
      nebula.parts = []
      // loop: NOT-WORTH — 240 particles, once per scene entry
      for (let i = 0; i < 240; i++) nebula.parts.push({
        ang: Math.random() * 6.28,
        rad: 0.12 + Math.random() * 0.9,          // fills center-to-edge: a cloud, not a ring
        spd: (Math.random() < 0.5 ? -1 : 1) * (0.0015 + Math.random() * 0.004),
        wob: Math.random() * 6.28,
        band: (i * 7) % 48                         // each particle tracks a frequency band
      })
    }
    nebula.pulse += ((beat.hit && pace === 1 ? 1 : 0) - nebula.pulse) * (beat.hit ? 0.6 : 0.06)   // reduced motion: no bloom
    nebula.rot += (0.001 + a.energy * 0.012) * pace
    const cx = W / 2, cy = H / 2
    // always a substantial cloud; bass/beat make it breathe outward
    const base = Math.min(W, H) * (0.30 + a.bass * 0.32 + nebula.pulse * 0.12)
    ctx.globalCompositeOperation = 'lighter'
    // loop: HOT-PATH-OK — 240 particles per frame, a radial gradient each: measured, caching them (per hue, mapped
    // with the transform) made frames dearer to rasterise than making them (docs/PERFORMANCE.md "Visualizer paint")
    for (const p of nebula.parts) {
      p.ang += p.spd * (1 + a.energy * 2) * pace; p.wob += 0.03 * pace
      const bandV = shown[p.band] || 0
      const rad = base * (p.rad + bandV * 0.28) + Math.sin(p.wob) * 8 * dpr
      const x = cx + Math.cos(p.ang + nebula.rot) * rad
      const y = cy + Math.sin(p.ang + nebula.rot) * rad * 0.8
      const size = (2.4 + bandV * 7) * dpr        // reacts to its band, visible baseline
      const hue = STAGE.nebula.h - p.rad * 60 + bandV * 40   // fuchsia core -> violet edges
      glow(x, y, size * 2.6, STAGE.nebula, hue)
    }
    // soft core, not a white sun
    glow(cx, cy, (30 + nebula.pulse * 60 + a.bass * 120) * dpr, STAGE.nebulaCore, STAGE.nebulaCore.h)
    ctx.globalCompositeOperation = 'source-over'
  }

  // --- MODE 4: toast (After Dark homage; sprites rendered from Marcy's Blender model: toasters.js) ---
  // The sky starts empty; toasters and slices launch one by one from just off the top/right edges,
  // swoop in fast, ease down to their own cruising speed and fly the diagonal their noses point along
  // (toasters.js flight). When one leaves at the bottom/left it comes back after its own random wait.
  // Faster flyers are nearer: drawn last (on top) and a touch larger. The music sets the wing flap rate
  // (tempo, energy) and nudges everyone's speed. The 8 flap frames and the toast are loaded once; a
  // frame is one drawImage per visible flyer (smoothed, scaled to the screen height).
  const TOASTERS = require('./toasters')
  // lifetime: OK — the 9 images are loaded once at page load and live as long as the window
  function loadImage(src) { const img = new Image(); img.src = src; return img }
  const toastImages = { frames: TOASTERS.TOASTER_FILES.map(loadImage), slice: loadImage(TOASTERS.TOAST_FILE) }
  // lifetime: OK — toast.fl (the flyer pool) is made on the first toast frame and kept for the window's life;
  // a scene (re)entry empties the sky in place (resetFlight), a resize rescales it (resizeFlight)
  const toast = { fl: null, reset: true, k: 1, w: 0, h: 0, sw: 0, sh: 0, speed: 1, last: 0, time: 0 }
  function sizeToast() {
    const size = TOASTERS.spriteSize(H)
    toast.sw = size.w; toast.sh = size.h; toast.k = size.k
    toast.w = W; toast.h = H
  }
  function renderToast(a) {
    if (!toast.fl) {
      sizeToast()
      toast.fl = TOASTERS.createFlight(W, H, toast.sw, toast.sh)
      toast.reset = false
    } else if (toast.w !== W || toast.h !== H) {
      sizeToast()
      TOASTERS.resizeFlight(toast.fl, W, H, toast.sw, toast.sh)   // keep the flyers, rescale the sky
    }
    if (toast.reset) { TOASTERS.resetFlight(toast.fl); toast.reset = false; toast.last = 0 }
    const now = performance.now()
    const dt = (toast.last ? Math.min(0.05, (now - toast.last) / 1000) : 0) * pace   // reduced motion: slower flight and flaps
    toast.last = now
    toast.time += dt
    ctx.globalCompositeOperation = 'source-over'
    ctx.imageSmoothingEnabled = true
    ctx.imageSmoothingQuality = 'high'
    ctx.clearRect(0, 0, W, H)
    ctx.fillStyle = STAGE.sky; ctx.fillRect(0, 0, W, H)    // night sky, the album glow faint behind
    // the music nudges everyone's speed (±15 %), smoothed so it never jerks
    toast.speed += ((0.9 + 0.35 * Math.min(1, a.energy * 1.6)) - toast.speed) * Math.min(1, dt * 1.5)
    // wings flap at the tempo, quicker when the track is busy (one cycle = the 8 frames)
    const flapRate = Math.min(3.2, Math.max(1, beat.bpm / 60)) * (0.75 + 0.5 * Math.min(1, a.energy * 1.6))
    const fl = toast.fl
    TOASTERS.stepFlight(fl, dt, toast.speed, flapRate)
    // draw slowest (farthest) first, so faster flyers land on top; no allocation per frame
    const pool = fl.pool, order = fl.order, k = toast.k
    // loop: HOT-PATH-OK — the flyer pool (~50) per frame, one drawImage per visible flyer, no allocation
    for (let i = 0; i < order.length; i++) {
      const f = pool[order[i]]
      if (!f.active) continue
      const img = f.toast ? toastImages.slice : toastImages.frames[TOASTERS.flapFrame(f.flap)]
      if (!img.naturalWidth) continue          // error: NOT-WORTH — still loading or failed: skip, never throw
      if (f.toast) {
        const tw = Math.round(TOASTERS.TOAST_SIZE.w * k * f.scale), th = Math.round(TOASTERS.TOAST_SIZE.h * k * f.scale)
        if (f.x - tw >= W || f.y - th >= H || f.x + tw <= 0 || f.y + th <= 0) continue
        // a slice rocks gently as it flies
        const ang = 0.28 * Math.sin(toast.time * 0.9 + f.rock * 6.28)
        ctx.setTransform(Math.cos(ang), Math.sin(ang), -Math.sin(ang), Math.cos(ang), Math.round(f.x), Math.round(f.y))
        ctx.drawImage(img, -tw / 2, -th / 2, tw, th)
        ctx.setTransform(1, 0, 0, 1, 0, 0)
      } else {
        const w = Math.round(toast.sw * f.scale), h = Math.round(toast.sh * f.scale)
        const x = Math.round(f.x - w / 2), y = Math.round(f.y - h / 2)
        if (x >= W || y >= H || x + w <= 0 || y + h <= 0) continue
        ctx.drawImage(img, x, y, w, h)
      }
    }
  }

  const RENDER = { bars: renderBars, aurora: renderAurora, nebula: renderNebula, toast: renderToast }
  // loop: HOT-PATH-OK — render loop · requestAnimationFrame (display rate) through the frame gate (viz-frames.js) · runs
  // while the music plays, and a short settle after a pause, a scene change or a resize · frozen while paused
  // (Marcy 2026-10-16: no frames until playback resumes; 0.15.36 and before kept the ambient modes moving) ·
  // Chromium also stops rAF when the window is hidden/minimized; the loop ends with the window · cost one 2D
  // canvas frame (dpr capped at 1.5) per display frame while playing, none while paused.
  // Toast scene per frame: one stepFlight over a fixed flyer pool (~50 at any size, no allocation) and one
  // cached-frame drawImage per visible flyer; launches cost a few distance checks, only when one launches.
  // error: NOT-WORTH — drawImage throws on a broken image, which would end this loop; renderToast skips sprites that
  // have no pixels (still loading or failed), so a missing file leaves an empty sky, not a dead visualizer.
  function frame() {
    const a = stepBands()
    detectBeat(a)
    RENDER[MODES[modeIdx]](a)
  }
  // resuming after a freeze: the toasters take no time step across the pause (no jump)
  gate = require('./viz-frames').createFrameGate({ draw: frame, raf: requestAnimationFrame, now: () => performance.now(), onResume: () => { toast.last = 0 } })
</script>
</body>
</html>
